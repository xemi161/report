<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간업무보고 · 대시보드 시안 ⑤ 스탯바+표형 리스트</title>
<style>
  /* ===========================================================
     색상 토큰 — design/weekly-report-mockup.html에서 그대로 가져옴.
     새 oklch 값을 만들지 않는다. 라이트 전용(다크모드 배제, 사용자 확정).
     =========================================================== */
  :root{
    --bg: oklch(98% 0.005 250);
    --surface: oklch(100% 0 0);
    --surface-sunken: oklch(97% 0.006 250);
    --border: oklch(90% 0.012 260);
    --border-soft: oklch(94% 0.008 260);
    --text: oklch(22% 0.02 260);
    --text-muted: oklch(48% 0.02 260);
    --text-faint: oklch(65% 0.012 260);
    --accent: oklch(55% 0.16 260);
    --accent-hover: oklch(48% 0.16 260);
    --accent-soft: oklch(95% 0.03 260);
    --accent-soft-fg: oklch(45% 0.16 260);
    --warn-bg: oklch(94% 0.08 80);
    --warn-fg: oklch(45% 0.14 70);
    --danger-bg: oklch(93% 0.09 25);
    --danger-fg: oklch(48% 0.17 25);
    --danger-border: oklch(80% 0.12 25);
    --good-bg: oklch(93% 0.06 150);
    --good-fg: oklch(42% 0.13 150);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.04);
    --shadow-sm: 0 4px 16px oklch(22% 0.02 260 / 0.07);
    --shadow-lg: 0 16px 40px oklch(20% 0.02 260 / 0.14);
  }
  /* 뷰어/OS 다크 설정과 무관하게 항상 이 톤 — 기준 목업과 동일한 고정 블록 */
  :root[data-theme="dark"], :root[data-theme="light"]{
    --bg: oklch(98% 0.005 250); --surface: oklch(100% 0 0); --surface-sunken: oklch(97% 0.006 250);
    --border: oklch(90% 0.012 260); --border-soft: oklch(94% 0.008 260);
    --text: oklch(22% 0.02 260); --text-muted: oklch(48% 0.02 260); --text-faint: oklch(65% 0.012 260);
    --accent: oklch(55% 0.16 260); --accent-hover: oklch(48% 0.16 260);
    --accent-soft: oklch(95% 0.03 260); --accent-soft-fg: oklch(45% 0.16 260);
    --warn-bg: oklch(94% 0.08 80); --warn-fg: oklch(45% 0.14 70);
    --danger-bg: oklch(93% 0.09 25); --danger-fg: oklch(48% 0.17 25); --danger-border: oklch(80% 0.12 25);
    --good-bg: oklch(93% 0.06 150); --good-fg: oklch(42% 0.13 150);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.04); --shadow-sm: 0 4px 16px oklch(22% 0.02 260 / 0.07);
    --shadow-lg: 0 16px 40px oklch(20% 0.02 260 / 0.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  button,input,select,textarea{font:inherit;color:inherit;}
  input,select{background:transparent;}
  ::placeholder{color:var(--text-faint);}
  .tabular{font-variant-numeric:tabular-nums;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

  /* ---------- 시안 선택기(이 탐색용 파일에만 있는 크롬 — 실제 화면 요소 아님) ---------- */
  .picker{position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px solid var(--border-soft);}
  .picker-inner{max-width:1240px; margin:0 auto; padding:14px 28px 12px;}
  .picker-top{display:flex; align-items:baseline; gap:12px; margin-bottom:11px; flex-wrap:wrap;}
  .picker-top .t{font-size:16px; font-weight:700; letter-spacing:-.015em;}
  .picker-top .s{font-size:12px; color:var(--text-muted);}
  .picker-top .kb{margin-left:auto; font-size:11.5px; color:var(--text-faint);}
  .chips{display:flex; flex-wrap:wrap; gap:5px;}
  .chips button{
    border:1px solid var(--border-soft); background:var(--surface); color:var(--text-muted);
    padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer;
    transition:background .12s,color .12s,border-color .12s;
  }
  .chips button:hover{background:var(--surface-sunken); color:var(--text);}
  .chips button.on{background:var(--accent); border-color:var(--accent); color:oklch(100% 0 0);}
  .chips button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .desc{margin-top:11px; font-size:12.5px; color:var(--text-muted); line-height:1.55;}
  .desc b{color:var(--text); font-weight:600;}

  /* 각 시안이 "앱 안"이라는 걸 보여주는 가짜 앱 헤더 — 3탭(대시보드/작성/히스토리) 확정 IA */
  .appbar{background:var(--surface); border-bottom:1px solid var(--border-soft);}
  .appbar-inner{max-width:1140px; margin:0 auto; padding:14px 28px; display:flex; align-items:center; gap:20px;}
  .brand{display:flex; align-items:baseline; gap:9px; margin-right:auto;}
  .brand .name{font-size:18px; font-weight:700; letter-spacing:-.015em;}
  .brand .who{font-size:12.5px; color:var(--text-muted);}
  .seg{display:flex; gap:3px; background:var(--surface-sunken); padding:3px; border-radius:12px; border:1px solid var(--border-soft);}
  .seg button{
    padding:6px 14px; border:none; border-radius:9px; font-size:12.5px; font-weight:600; cursor:default;
    background:transparent; color:var(--text-muted);
  }
  .seg button.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}

  main{max-width:1140px; margin:0 auto; padding:28px 28px 90px;}
  main.wide{max-width:1240px;}

  /* ---------- 공통 컴포넌트 (기준 목업과 동일) ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:18px; padding:26px 28px;
    transition:box-shadow .15s;
  }
  .card:hover{box-shadow:var(--shadow-sm);}
  .card.tight{padding:20px 22px;}
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px;}
  .card-title{display:flex; align-items:center; gap:9px;}
  .card-title h2{font-size:15px; font-weight:600; letter-spacing:-.01em; margin:0;}
  .card-title .count{
    font-size:11.5px; font-weight:700; color:var(--accent-soft-fg); background:var(--accent-soft);
    padding:2px 9px; border-radius:999px;
  }
  .kicker{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint);}
  .badge{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px;}
  .badge.carry{background:var(--warn-bg); color:var(--warn-fg);}
  .badge.done{background:var(--good-bg); color:var(--good-fg);}
  .badge.draft{background:var(--accent-soft); color:var(--accent-soft-fg);}
  .badge.idle{background:var(--surface-sunken); color:var(--text-muted);}
  .bar{height:5px; border-radius:999px; background:var(--surface-sunken); overflow:hidden;}
  .bar > i{display:block; height:100%; border-radius:999px; background:var(--accent);}
  .bar.low > i{background:var(--danger-border);}
  .btn{
    border:none; background:var(--accent); color:oklch(100% 0 0); padding:11px 22px; border-radius:12px;
    font-size:13.5px; font-weight:700; cursor:pointer; transition:background .12s,box-shadow .12s;
  }
  .btn:hover{background:var(--accent-hover); box-shadow:var(--shadow-sm);}
  .btn.sm{padding:8px 16px; font-size:12.5px; border-radius:10px;}
  .btn.outline{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn.outline:hover{background:var(--surface-sunken); box-shadow:none;}
  .ghost{
    border:none; background:transparent; color:var(--text-muted); padding:7px 12px; border-radius:10px;
    font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    transition:background .12s,color .12s;
  }
  .ghost:hover{background:var(--surface-sunken); color:var(--accent);}
  .link-more{
    border:none; background:transparent; color:var(--text-muted); cursor:pointer;
    font-size:12.5px; font-weight:600; padding:6px 10px; border-radius:9px;
    display:inline-flex; align-items:center; gap:5px; transition:background .12s,color .12s;
  }
  .link-more:hover{background:var(--surface-sunken); color:var(--accent);}
  .section-head{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .section-head h2{font-size:15px; font-weight:700; margin:0; letter-spacing:-.01em;}
  .stack{display:flex; flex-direction:column; gap:18px;}
  .dash-list{display:flex; flex-direction:column; gap:12px;}

  /* 통계 타일 */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px;}
  .stat{background:var(--surface); border:1px solid var(--border-soft); border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; gap:6px;}
  .stat .k{font-size:12px; color:var(--text-muted);}
  .stat .v{font-size:26px; font-weight:700; letter-spacing:-.02em;}
  .stat .v small{font-size:13px; font-weight:600; color:var(--text-muted); margin-left:3px;}
  .stat .v.low{color:var(--danger-fg);}
  .stat .s{font-size:11.5px; color:var(--text-faint);}

  /* 과거 제출본 행 */
  .hist-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:18px; overflow:hidden; cursor:pointer; transition:border-color .12s, box-shadow .15s;}
  .hist-card:hover{border-color:var(--text-faint); box-shadow:var(--shadow-sm);}
  .hist-summary{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 22px;}
  .hist-left{display:flex; flex-direction:column; gap:3px;}
  .hist-left .wk{font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .hist-left .rng{font-size:12px; color:var(--text-muted);}
  .hist-right{display:flex; align-items:center; gap:18px;}
  .hist-metric{text-align:right;}
  .hist-metric .n{font-size:15px; font-weight:700;}
  .hist-metric .l{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em;}
  .hist-metric.low .n{color:var(--danger-fg);}
  .chev{flex-shrink:0; color:var(--text-faint);}
  /* 카드 안에 카드가 겹치지 않도록: 테두리를 떼고 얇은 구분선으로 */
  .flush .hist-card{border:none; border-radius:12px; box-shadow:none;}
  .flush .hist-card + .hist-card{border-top:1px solid var(--border-soft);}
  .flush .hist-card:hover{background:var(--surface-sunken);}
  .flush .hist-summary{padding:13px 10px;}

  /* 진행중 프로젝트 행 */
  .proj-row{display:flex; flex-direction:column; gap:8px; padding:14px 0; border-bottom:1px solid var(--border-soft);}
  .proj-row:last-child{border-bottom:none;}
  .proj-top{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
  .proj-top .nm{font-size:13.5px; font-weight:600;}
  .proj-top .tk{font-size:11.5px; color:var(--text-muted); background:var(--surface-sunken); padding:2px 9px; border-radius:999px;}
  .proj-top .pc{margin-left:auto; font-size:13px; font-weight:700;}
  .proj-meta{font-size:11.5px; color:var(--text-faint);}

  /* 맨위크 */
  .mw-big{font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1.15; margin-top:8px;}
  .mw-big.low{color:var(--danger-fg);}
  .mw-sub{font-size:12px; color:var(--text-muted); margin-top:3px;}
  .mw-weeks{display:flex; flex-direction:column; gap:12px; margin-top:16px; padding-top:14px; border-top:1px solid var(--border-soft);}
  .mw-week{display:flex; flex-direction:column; gap:6px;}
  .mw-week .top{display:flex; justify-content:space-between; align-items:baseline; font-size:12px;}
  .mw-week .top .lb{color:var(--text-muted);}
  .mw-week .top .vl{font-weight:700;}
  .mw-week .top .vl.low{color:var(--danger-fg);}

  /* 일일 기록 */
  .day-group{margin-top:14px;}
  .day-group:first-child{margin-top:6px;}
  .day-head{display:flex; align-items:center; gap:8px; padding-bottom:5px; border-bottom:1px solid var(--border-soft);
    font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--text-faint);}
  .day-head .today-chip{background:var(--accent-soft); color:var(--accent-soft-fg); padding:1px 7px; border-radius:999px; font-size:10px;}
  .day-head .day-sum{margin-left:auto; font-weight:700; letter-spacing:0; color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .daily-item{display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px solid var(--border-soft); font-size:13px;}
  .daily-item:last-child{border-bottom:none;}
  .daily-item .tx{flex:1; min-width:0; padding:2px 0;}
  .daily-item .hh{flex:none; font-size:12.5px; font-weight:700; color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .daily-item .hh.none{color:var(--text-faint); font-weight:400;}
  .quick{display:flex; align-items:center; gap:8px; margin-top:12px; padding:8px 10px; border:1.5px dashed var(--border); border-radius:12px;}
  .quick input[type=text]{flex:1; border:1px solid transparent; border-radius:8px; padding:5px 6px; font-size:13px;}
  .quick input[type=text]:hover{background:var(--surface-sunken);}
  .quick input[type=text]:focus{border-color:var(--accent); background:var(--surface-sunken); outline:none;}
  .quick input[type=number]{width:56px; text-align:right; border:1px solid transparent; border-radius:8px; padding:5px 6px; font-size:13px;}
  .quick input[type=number]:hover{background:var(--surface-sunken);}
  .quick input[type=number]:focus{border-color:var(--accent); background:var(--surface-sunken); outline:none;}
  .quick .unit{color:var(--text-faint); font-size:12.5px;}

  /* 요일 스트립 */
  .wk-days{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:8px;}
  .wk-day{border:1px solid var(--border-soft); border-radius:12px; padding:9px 5px 8px; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0;}
  .wk-day .dw{font-size:11px; font-weight:700; color:var(--text-faint);}
  .wk-day .bar-v{width:100%; height:38px; border-radius:8px; background:var(--surface-sunken); display:flex; align-items:flex-end; overflow:hidden;}
  .wk-day .bar-v > i{display:block; width:100%; background:var(--accent); border-radius:8px;}
  .wk-day .hh{font-size:11px; font-weight:700; color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .wk-day.empty .hh{color:var(--text-faint); font-weight:400;}
  .wk-day.today{border-color:var(--accent);}
  .wk-day.today .dw{color:var(--accent-soft-fg);}

  /* 보고 항목 행(표형 시안에서 사용) */
  .irow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-soft); font-size:13px;}
  .irow:last-child{border-bottom:none;}
  .irow .tk{width:112px; flex:none; color:var(--text-muted); font-size:12px;}
  .irow .ti{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .irow .ph{width:64px; flex:none; color:var(--text-muted); font-size:12px;}
  .irow .hr{width:52px; flex:none; text-align:right; font-variant-numeric:tabular-nums;}
  .irow .dy{width:44px; flex:none; text-align:right; color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .irow .pcw{width:104px; flex:none; display:flex; align-items:center; gap:7px;}
  .irow .pcw .bar{flex:1;}
  .irow .pcw .n{width:34px; text-align:right; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums;}
  .irow .bd{width:44px; flex:none; text-align:right;}
  .thead{display:flex; align-items:center; gap:10px; padding:0 0 8px; border-bottom:1px solid var(--border-soft);
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint);}
  .thead > span{white-space:nowrap;}

  /* =========================================================
     ① Hero + 스택 (현행 근접)
     ========================================================= */
  .c1 .hero{display:flex; align-items:flex-start; justify-content:space-between; gap:24px; flex-wrap:wrap;}
  .c1 .hero-left{display:flex; flex-direction:column; gap:6px;}
  .c1 .hero-left .wk{font-size:22px; font-weight:700; letter-spacing:-.025em; display:flex; align-items:center; gap:10px;}
  .c1 .hero-left .rng{font-size:12.5px; color:var(--text-muted);}
  .c1 .hero-metrics{display:flex; gap:28px; align-items:flex-end; margin-left:auto;}
  .c1 .hm{text-align:right;}
  .c1 .hm .v{font-size:26px; font-weight:700; letter-spacing:-.02em; line-height:1.1;}
  .c1 .hm .v.low{color:var(--danger-fg);}
  .c1 .hm .v small{font-size:13px; font-weight:600; color:var(--text-muted); margin-left:2px;}
  .c1 .hm .k{font-size:11px; color:var(--text-faint);}
  .c1 .two{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start;}
  @media (max-width:900px){ .c1 .two{grid-template-columns:1fr;} }

  /* =========================================================
     ② 벤토 모자이크 (v7 — 진행 중인 후보)
     ========================================================= */
  .c2 .bento{display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); grid-auto-rows:62px; gap:14px;}
  .c2 .bento > *{min-width:0; min-height:0;}
  .c2 .bento .card{padding:20px 22px;}
  .c2 .t-hero{grid-column:span 6; grid-row:span 4; display:flex; flex-direction:column; gap:16px; justify-content:space-between;}
  .c2 .t-metric{grid-column:span 3; grid-row:span 2;}
  .c2 .t-daily{grid-column:span 8; grid-row:span 6;}
  .c2 .t-todo{grid-column:span 4; grid-row:span 10;}
  .c2 .t-mw{grid-column:span 4; grid-row:span 4;}
  .c2 .t-proj{grid-column:span 4; grid-row:span 4;}
  .c2 .t-hist{grid-column:1 / -1;}
  .c2 .bento-foot{display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); gap:14px; margin-top:14px;}
  .c2 .tile{display:flex; flex-direction:column;}
  .c2 .tile-body{flex:1; min-height:0; overflow:auto; margin:0 -6px; padding:0 6px;}
  .c2 .metric{display:flex; flex-direction:column; justify-content:space-between; gap:6px;}
  .c2 .bento .card.metric{padding:16px 18px;}
  .c2 .metric .v{font-size:40px; font-weight:700; letter-spacing:-.035em; line-height:1; display:flex; align-items:baseline; gap:3px;}
  .c2 .metric .v u{font-size:14px; font-weight:600; color:var(--text-muted); text-decoration:none;}
  .c2 .metric .s{font-size:11.5px; color:var(--text-muted);}
  .c2 .metric.low .v{color:var(--danger-fg);}
  .c2 .hero-title .wk{font-size:30px; font-weight:700; letter-spacing:-.03em; line-height:1.1;}
  .c2 .todo-item{display:flex; align-items:flex-start; gap:7px; padding:6px 0; border-bottom:1px solid var(--border-soft); font-size:13px;}
  .c2 .todo-item:last-child{border-bottom:none;}
  .c2 .todo-item input{margin:4px 0 0; accent-color:var(--accent);}
  .c2 .todo-item .tx{flex:1; min-width:0;}
  .c2 .prio{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; color:var(--text-faint); white-space:nowrap;}
  .c2 .prio.high{background:var(--warn-bg); color:var(--warn-fg);}
  @media (max-width:1180px){
    .c2 .bento{grid-template-columns:repeat(6, minmax(0,1fr)); grid-auto-rows:auto;}
    .c2 .bento > *{grid-row:auto !important;}
    .c2 .t-hero, .c2 .t-daily, .c2 .t-todo{grid-column:span 6;}
    .c2 .t-metric, .c2 .t-mw, .c2 .t-proj{grid-column:span 3;}
    .c2 .tile-body{overflow:visible; margin:0; padding:0;}
  }

  /* =========================================================
     ③ 서술형 브리핑 (Narrative)
     ========================================================= */
  .c3 .brief{padding:34px 36px;}
  .c3 .brief p{font-size:19px; line-height:1.72; margin:0 0 12px; letter-spacing:-.01em; max-width:760px;}
  .c3 .brief p:last-of-type{margin-bottom:0;}
  .c3 .brief b{font-weight:700;}
  .c3 .brief b.n{background:var(--accent-soft); color:var(--accent-soft-fg); padding:1px 7px; border-radius:8px;}

const TODOS = [

/* ---------- 공통 헬퍼 ---------- */
const num = v => String(v).replace(/\.0$/,"");
const noteSum = g => g.list.reduce((a,b)=> a + (b.h||0), 0);

const statusBadge = () => WEEK.status==="draft"

  const low = r.mw < 0.8;

}
function projRow(p){

  </div>`;
}
function noteGroup(g, opt){
  const sum = noteSum(g);
  const rows = g.list.map(n=>`<div class="daily-item"><span class="tx">${n.t}</span>${
    n.h!=null ? `<span class="hh">${num(n.h)}h</span>` : `<span class="hh none">—</span>`}</div>`).join("");
  return `<div class="day-group">
    <div class="day-head"><span>${g.d.replace("-",".")} (${g.dw})</span>

      ${sum>0?`<span class="day-sum">${num(sum)}h</span>`:""}</div>
    ${rows}</div>`;
}
function notesBlock(n){ return NOTES.slice(0,n).map(g=>noteGroup(g)).join(""); }
const quickAdd = `<div class="quick">
    <input type="text" placeholder="오늘 한 일을 한 줄로…">
    <input type="number" placeholder="0" step="0.5"><span class="unit">h</span>
    <button class="ghost">+ 추가</button></div>`;
function mwWeeks(){
  return `<div class="mw-weeks">${AVG.weeks.map(w=>{
    const low = w.v<0.8, pct = Math.min(100, Math.round(w.v*100));
    return `<div class="mw-week"><div class="top"><span class="lb">${w.lb}</span><span class="vl ${low?"low":""} tabular">${w.v.toFixed(2)}</span></div>
      <div class="bar ${low?"low":""}"><i style="width:${pct}%"></i></div></div>`;}).join("")}</div>`;
}
function wkStrip(){
  return `<div class="wk-days">${WEEKDAYS.map(d=>{
    const h = dayHours(d.d), pct = Math.min(100, Math.round(h/8*100));
    return `<div class="wk-day ${h?"":"empty"} ${d.today?"today":""}">
      <span class="dw">${d.dw}</span>
      <span class="bar-v">${h?`<i style="height:${pct}%"></i>`:""}</span>
      <span class="hh">${h?num(h)+"h":"—"}</span></div>`;}).join("")}</div>`;
}
function itemRow(it){
  const badges = (it.pc===100?'<span class="badge done">완료</span>':"") + (it.carry?'<span class="badge carry">이월</span>':"");
  return `<div class="irow">
    <span class="tk">${it.tk||"—"}</span>
    <span class="ti">${it.ti}</span>
    <span class="ph">${it.ph}</span>
    <span class="hr">${it.h}h</span>
    <span class="dy">${it.d}일</span>
    <span class="pcw">${it.pc!=null?`<span class="bar"><i style="width:${it.pc}%"></i></span><span class="n">${it.pc}%</span>`:'<span class="n" style="width:100%;color:var(--text-faint)">—</span>'}</span>
    <span class="bd">${badges||""}</span></div>`;
}


/* =========================================================================
   ⑤ 얇은 스탯바 + 표형 리스트 — 카드 수를 최소로, 밀도를 최대로
   ========================================================================= */
function c5(){
  const byProject = PROJECTS.map(p => ({p, rows: ITEMS.filter(i=>i.tk===p.tk)}));
  const etc = ITEMS.filter(i=>!i.tk);
  return `<div class="c5 stack">
    <div class="statbar">
      <div class="sb"><span class="k">이번 주</span><span class="v" style="font-size:17px">${WEEK.label}</span></div>
      <div class="sb"><span class="k">총 시간</span><span class="v">${WEEK.hours}<small>h</small></span></div>
      <div class="sb"><span class="k">맨위크</span><span class="v low">${WEEK.mw.toFixed(2)}</span></div>
      <div class="sb"><span class="k">2주 평균</span><span class="v">${AVG.value.toFixed(2)}</span></div>
      <div class="sb"><span class="k">항목</span><span class="v">${WEEK.items}<small>건</small></span></div>
      <div class="sb"><span class="k">이번 주 기록</span><span class="v">${num(totalNoteH)}<small>h</small></span></div>
      <div class="sb cta"><button class="btn sm">이어서 작성</button></div>
    </div>
    <div class="two">
      <div class="card">
        <div class="card-head"><div class="card-title"><h2>이번 주 보고 항목</h2><span class="count">${WEEK.items}</span></div>
          <button class="link-more">작성 탭에서 편집 ›</button></div>
        <div class="thead" style="margin-top:8px">
          <span class="tk" style="width:112px">일감</span><span class="ti" style="flex:1">제목</span>
          <span class="ph" style="width:64px">구분</span><span class="hr" style="width:52px;text-align:right">시간</span>
          <span class="dy" style="width:44px;text-align:right">일수</span><span class="pcw" style="width:104px">진행률</span><span class="bd" style="width:44px"></span></div>
        ${byProject.map(({p,rows})=>`
          <div class="grp"><span>${p.nm}</span><span class="tk">${p.tk}</span><span class="pc tabular">${p.pct}%</span></div>
          ${rows.map(itemRow).join("")}`).join("")}
        <div class="grp"><span>기타</span></div>
        ${etc.map(itemRow).join("")}
      </div>
      <div class="stack">
        <div class="card">
          <div class="card-head"><div class="card-title"><h2>오늘 한 일</h2></div><button class="link-more">기록 ›</button></div>
          ${notesBlock(3)}
          ${quickAdd}
        </div>
        <div class="card">
          <div class="card-head"><div class="card-title"><h2>과거 제출본</h2></div><button class="link-more">히스토리 ›</button></div>
          <div class="dash-list flush">${HISTORY.map(histRow).join("")}</div>
        </div>
      </div>
    </div>
  </div>`;
}

document.getElementById("stage").innerHTML = c5();
</script>
</body>
