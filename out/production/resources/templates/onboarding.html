<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('시작하기')}"></head>
<body>
<div class="onboarding-wrap">
    <div class="card">
        <h1>처음이시군요 👋</h1>
        <p class="lead">이름과 직책, 티켓번호 접두사를 입력하면 다음부터는 이 화면이 생략됩니다.</p>

        <div class="error-banner" th:if="${error}" th:text="${error}">에러</div>

        <form th:action="@{/onboarding}" th:object="${form}" method="post">
            <label for="name">이름</label>
            <input type="text" id="name" th:field="*{name}" placeholder="예: 정준호"/>

            <label for="role">직책</label>
            <input type="text" id="role" th:field="*{role}" placeholder="예: 파트원"/>

            <label for="ticketPrefix">티켓번호 접두사</label>
            <input type="text" id="ticketPrefix" th:field="*{ticketPrefix}" placeholder="예: NHNKCP-개발1팀"/>

            <button type="submit" class="btn" style="margin-top:22px; width:100%;">시작하기</button>
        </form>
    </div>
</div>
</body>
</html>
