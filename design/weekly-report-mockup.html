<title>주간업무보고 · 디자인 목업</title>
<style>
  :root{
    --bg: oklch(98% 0.005 250);
    --surface: oklch(100% 0 0);
    --surface-sunken: oklch(97% 0.006 250);
    --border: oklch(90% 0.012 260);
    --border-soft: oklch(94% 0.008 260);
    --text: oklch(22% 0.02 260);
    --text-muted: oklch(48% 0.02 260);
    --text-faint: oklch(65% 0.012 260);
    --accent: oklch(55% 0.16 260);
    --accent-hover: oklch(48% 0.16 260);
    --accent-soft: oklch(95% 0.03 260);
    --accent-soft-fg: oklch(45% 0.16 260);
    --warn-bg: oklch(94% 0.08 80);
    --warn-fg: oklch(45% 0.14 70);
    --danger-bg: oklch(93% 0.09 25);
    --danger-fg: oklch(48% 0.17 25);
    --danger-border: oklch(80% 0.12 25);
    --good-bg: oklch(93% 0.06 150);
    --good-fg: oklch(42% 0.13 150);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.04);
    --shadow-sm: 0 4px 16px oklch(22% 0.02 260 / 0.07);
    --shadow-lg: 0 16px 40px oklch(20% 0.02 260 / 0.14);
  }
  /* 다크모드보다 레퍼런스 톤(라이트) 유지가 우선이라는 피드백에 따라
     의도적으로 단일 테마로 고정 — OS/뷰어 다크 설정과 무관하게 항상 이 톤을 보여준다. */
  :root[data-theme="dark"], :root[data-theme="light"]{
    --bg: oklch(98% 0.005 250); --surface: oklch(100% 0 0); --surface-sunken: oklch(97% 0.006 250);
    --border: oklch(90% 0.012 260); --border-soft: oklch(94% 0.008 260);
    --text: oklch(22% 0.02 260); --text-muted: oklch(48% 0.02 260); --text-faint: oklch(65% 0.012 260);
    --accent: oklch(55% 0.16 260); --accent-hover: oklch(48% 0.16 260);
    --accent-soft: oklch(95% 0.03 260); --accent-soft-fg: oklch(45% 0.16 260);
    --warn-bg: oklch(94% 0.08 80); --warn-fg: oklch(45% 0.14 70);
    --danger-bg: oklch(93% 0.09 25); --danger-fg: oklch(48% 0.17 25); --danger-border: oklch(80% 0.12 25);
    --good-bg: oklch(93% 0.06 150); --good-fg: oklch(42% 0.13 150);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.04); --shadow-sm: 0 4px 16px oklch(22% 0.02 260 / 0.07);
    --shadow-lg: 0 16px 40px oklch(20% 0.02 260 / 0.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    min-height:100vh; overflow-x:hidden;
  }
  button,input,select,textarea{font:inherit;color:inherit;}
  input,select{background:transparent;}
  ::placeholder{color:var(--text-faint);}
  .tabular{font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--border-soft);
  }
  .header-inner{
    max-width:1120px; margin:0 auto; padding:16px 28px;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:9px; margin-right:auto;}
  .brand .name{font-size:18px; font-weight:700; letter-spacing:-.015em;}
  .brand .who{font-size:12.5px; color:var(--text-muted);}
  .pager{display:flex; align-items:center; gap:2px;}
  .pager button{
    width:30px; height:30px; border-radius:10px; border:1px solid transparent;
    background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:var(--text-muted); transition:background .12s, color .12s;
  }
  .pager button:hover{background:var(--surface-sunken); color:var(--text);}
  .pager button:disabled{opacity:.35; cursor:not-allowed;}
  .pager button:focus-visible, .seg button:focus-visible, .btn:focus-visible, .ghost:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  .pager .label{font-size:13px; font-weight:600; min-width:132px; text-align:center; padding:0 4px;}
  .pager .range{font-size:11px; color:var(--text-faint); display:block; font-weight:400; margin-top:1px;}
  .seg{display:flex; gap:3px; background:var(--surface-sunken); padding:3px; border-radius:12px; border:1px solid var(--border-soft);}
  .seg button{
    padding:6px 14px; border:none; border-radius:9px; font-size:12.5px; font-weight:600; cursor:pointer;
    background:transparent; color:var(--text-muted); transition:background .12s, color .12s, box-shadow .12s;
  }
  .seg button.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}

  main{max-width:1140px; margin:0 auto; padding:32px 28px 110px;}
  .view{display:none; flex-direction:column; gap:22px;}
  .view.active{display:flex;}

  /* ---------- stat row ---------- */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px;}
  .stat{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:14px; padding:18px 20px;
    display:flex; flex-direction:column; gap:6px;
  }
  .stat .k{font-size:12px; color:var(--text-muted);}
  .stat .v{font-size:26px; font-weight:700; letter-spacing:-.02em;}
  .stat .v small{font-size:13px; font-weight:600; color:var(--text-muted); margin-left:3px;}

  /* ---------- cards ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:18px; padding:26px 28px;
    transition:box-shadow .15s;
  }
  .card:hover{box-shadow:var(--shadow-sm);}
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px;}
  .card-title{display:flex; align-items:center; gap:9px;}
  .card-title h2{font-size:15px; font-weight:600; letter-spacing:-.01em; margin:0;}
  .card-title .count{
    font-size:11.5px; font-weight:700; color:var(--accent-soft-fg); background:var(--accent-soft);
    padding:2px 9px; border-radius:999px;
  }
  .name-edit{
    border:1px solid transparent; border-radius:8px; padding:3px 7px; font-size:15px; font-weight:700;
    background:transparent; min-width:60px; transition:background .12s,border-color .12s;
  }
  .name-edit:hover{border-color:var(--border);}
  .name-edit:focus{border-color:var(--accent); outline:none; background:var(--surface-sunken);}

  /* 프로젝트 카드 헤더: 일감번호 → 프로젝트명 순. 프로젝트당 일감은 하나뿐이라 카드 상단에 바로 붙는다 */
  .card-title input.ticket{background:var(--surface-sunken); width:150px; flex-shrink:0;}

  .row-head{
    display:flex; align-items:center; gap:8px; padding:0 0 10px; margin-bottom:2px; flex-wrap:wrap;
    border-bottom:1px solid var(--border-soft);
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint);
  }
  .row-head > span{white-space:nowrap;}
  .rows{display:flex; flex-direction:column;}
  .row{border-bottom:1px solid var(--border-soft); padding:12px 0;}
  .row:last-child{border-bottom:none;}
  .row-main{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  /* row-main/simple-row = 메인 목록 행(문자처럼 보이다 hover/focus 시 강조). row-detail은 별도 규칙(항상 보이는 박스형) — 서로 안 겹치게 범위를 분리 */
  /* .daily-item의 시간 칸도 같은 스코프에 넣는다 — 일일 기록의 투입시간은 주간보고 항목의
     .hours-input과 "똑같은 컴포넌트"여야 한다(56px·우측정렬·h 단위·평소엔 텍스트, 만질 때만 강조). */
  .row-main input[type=text], .row-main input[type=number], .row-main input[type=date], .row-main select,
  .simple-row input[type=text], .simple-row input[type=number], .simple-row input[type=date], .simple-row select,
  .daily-item input[type=number]{
    border:1px solid transparent; border-radius:8px; padding:5px 7px; font-size:13px; transition:background .12s,border-color .12s;
  }
  .row-main input:hover, .row-main select:hover,
  .simple-row input:hover, .simple-row select:hover,
  .daily-item input[type=number]:hover{background:var(--surface-sunken);}
  .row-main input:focus, .row-main select:focus,
  .simple-row input:focus, .simple-row select:focus,
  .daily-item input[type=number]:focus{border-color:var(--accent); background:var(--surface-sunken); outline:none;}
  .ticket{
    width:132px; color:var(--text-muted); font-size:12.5px;
    border:1px solid transparent; border-radius:8px; padding:5px 7px; background:transparent;
    transition:background .12s,border-color .12s;
  }
  .ticket:hover{background:var(--surface-sunken);}
  .ticket:focus{border-color:var(--accent); background:var(--surface-sunken); outline:none;}
  .title-input{flex:1; min-width:160px; font-weight:500;}
  .phase-select{width:96px; color:var(--text-muted);}
  .hours-input{width:56px; text-align:right;}
  .days-input{width:40px; text-align:right;}
  .completion-input{width:52px; text-align:right;}
  .unit{color:var(--text-faint); font-size:12.5px; margin-right:2px;}
  .pct-wrap{display:flex; align-items:center; gap:6px; padding:3px 8px; border-radius:999px; background:var(--surface-sunken);}
  .badge{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px;}
  .badge.carry{background:var(--warn-bg); color:var(--warn-fg);}
  .badge.done{background:var(--good-bg); color:var(--good-fg);}
  .icon-btn{
    border:none; background:transparent; color:var(--text-faint); cursor:pointer; padding:5px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; transition:background .12s,color .12s;
  }
  .icon-btn:hover{background:var(--danger-bg); color:var(--danger-fg);}
  .icon-btn.chevron:hover{background:var(--surface-sunken); color:var(--text);}
  .icon-btn.chevron svg{transition:transform .15s;}
  .icon-btn.chevron.open svg{transform:rotate(90deg);}
  .row-detail{display:none; flex-direction:column; gap:9px; margin-top:8px; padding:14px 16px; background:var(--surface-sunken); border-radius:12px;}
  .row-detail.open{display:flex;}
  .row-detail label{font-size:11.5px; color:var(--text-muted); display:flex; flex-direction:column; gap:4px;}
  .row-detail label.inline{flex-direction:row; align-items:center; justify-content:space-between; gap:12px;}
  .row-detail input{border:1px solid var(--border-soft); border-radius:8px; padding:5px 9px; background:var(--surface);}
  .row-detail label.inline input{width:160px;}
  .row-detail .note-field input{width:100%;}

  .simple-row{display:flex; align-items:center; gap:12px;}
  .simple-row .title-input{flex:1;}

  .mode-toggle{
    border:none; background:var(--surface-sunken); color:var(--text-muted);
    padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap;
    transition:background .12s,color .12s;
  }
  .mode-toggle:hover{background:var(--accent-soft); color:var(--accent-soft-fg);}

  .ghost{
    margin-top:12px; align-self:flex-start; border:none; background:transparent;
    color:var(--text-muted); padding:7px 12px; border-radius:10px; font-size:12.5px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:background .12s,color .12s;
  }
  .ghost:hover{background:var(--surface-sunken); color:var(--accent);}

  .btn{
    border:none; background:var(--accent); color:oklch(100% 0 0); padding:11px 22px; border-radius:12px;
    font-size:13.5px; font-weight:700; cursor:pointer; transition:background .12s,box-shadow .12s;
  }
  .btn:hover{background:var(--accent-hover); box-shadow:var(--shadow-sm);}
  .btn.outline{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn.outline:hover{background:var(--surface-sunken); box-shadow:none;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  .submit-bar{display:flex; justify-content:flex-end; align-items:center; gap:10px; padding-top:4px;}

  /* ---------- empty / locked states ---------- */
  .empty-state{
    background:var(--surface); border:1.5px dashed var(--border); border-radius:18px;
    padding:56px 24px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .empty-state .icon{color:var(--text-faint);}
  .empty-state h3{font-size:15px; margin:0;}
  .empty-state p{font-size:13px; color:var(--text-muted); margin:0; max-width:320px;}
  .empty-hint{color:var(--text-faint); font-size:12.5px; padding:12px 0;}

  .locked-banner{
    display:flex; align-items:center; gap:10px; background:var(--accent-soft); color:var(--accent-soft-fg);
    border-radius:12px; padding:11px 16px; font-size:12.5px; font-weight:600;
  }
  .locked-banner svg{flex-shrink:0;}

  /* ---------- history ---------- */
  /* 히스토리 카드는 아코디언이 아니라 클릭 시 "작성" 탭의 해당 주로 이동하는 내비게이션 행 */
  .hist-card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:18px; overflow:hidden;
    cursor:pointer; transition:border-color .12s, box-shadow .15s;
  }
  .hist-card:hover{border-color:var(--text-faint); box-shadow:var(--shadow-sm);}
  .hist-summary{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 24px;}
  .hist-left{display:flex; flex-direction:column; gap:3px;}
  .hist-left .wk{font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .hist-left .rng{font-size:12px; color:var(--text-muted);}
  .hist-right{display:flex; align-items:center; gap:18px;}
  .hist-metric{text-align:right;}
  .hist-metric .n{font-size:15px; font-weight:700;}
  .hist-metric .l{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em;}
  .hist-metric.low .n{color:var(--danger-fg);}
  .low-stripe{width:4px; align-self:stretch; background:var(--danger-border); border-radius:2px;}
  .chev{flex-shrink:0; color:var(--text-faint);}

  /* ---------- dashboard — 벤토 그리드 (v7) ---------- */
  /* v6까지 대시보드는 "hero 한 줄 + 좌우 2컬럼 스택"이었다. 카드가 전부 비슷한 크기라
     화면이 균일한 격자로 읽혔고("눈에 탁 띄지 않는다"는 피드백), 무엇이 중요한지를 배치가 말해주지 못했다.
     v7은 같은 정보를 **크기가 엇갈리는 모자이크(벤토)**로 다시 깐다.

     제약: 색으로 참신함을 만들지 않는다 — 다크모드 없음, 새 oklch 토큰 없음, 연회색 배경 + 흰 카드 그대로.
     참신함은 오직 (1) 타일 면적 차이 (2) 밀도(간격 22→14, 패딩 26/28→20/22)
     (3) 작은 타일에 들어가는 거대 숫자(40px)의 대비에서 나온다.

     12컬럼 × 62px 고정 행. 고정 행이어야 "4행짜리 큰 타일 옆에 2행짜리 작은 타일 둘"처럼
     행을 쪼개 쓰는 배치가 가능하다(행 높이가 내용에 따라 늘면 모자이크가 무너진다).
     대신 내용이 넘칠 수 있는 목록 타일은 .tile-body가 안에서 스크롤한다.

     배치는 auto-flow(sparse)에 맡긴다 — 아래 순서로 넣으면 다음 모자이크가 나온다.
     순서: hero → 지표 4 → 오늘 한 일 → TODO → 맨위크 → 진행중 프로젝트
        ┌───────────────┬──────┬──────┐
        │ 이번 주 (6×4)  │ 시간  │ 맨위크│   작은 타일 = 3×2
        │               ├──────┼──────┤
        │               │ 지남  │ 진행중│
        ├───────────────┴──┬───┴──────┤
        │ 오늘 한 일 (8×6)   │  TODO    │
        ├─────────┬─────────┤ (4×10)   │
        │ 맨위크4×4│진행중4×4 │          │
        └─────────┴─────────┴──────────┘
     좌측(8칸) 6+4=10행, 우측 TODO 10행 → 두 덩어리가 같은 줄에서 끝난다.
     ⚠️ 타일을 넣는 순서를 바꾸면 이 계산이 깨진다(grid-auto-flow는 dense가 아니다). */
  .bento{display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); grid-auto-rows:62px; gap:14px;}
  .bento > *{min-width:0; min-height:0;}
  .bento .card{padding:20px 22px;}
  .dash-wrap{display:flex; flex-direction:column; gap:14px;}

  /* 타일 크기 배정 = 정보의 무게. 매일 손대는 것(오늘 한 일·TODO)이 가장 크고,
     한눈에 확인만 하는 지표는 가장 작다. 주 단위로 훑는 추세(맨위크·진행중)는 그 중간. */
  .t-hero  {grid-column:span 6; grid-row:span 4;}
  .t-metric{grid-column:span 3; grid-row:span 2;}
  .t-daily {grid-column:span 8; grid-row:span 6;}
  .t-todo  {grid-column:span 4; grid-row:span 10;}
  .t-mw    {grid-column:span 4; grid-row:span 4;}
  .t-proj  {grid-column:span 4; grid-row:span 4;}
  /* 마지막 줄(과거 보고서)만 내용 높이로 둔다 — 목록 길이가 보고서 개수에 따라 변하므로 62px 격자에 못 박지 않는다.
     같은 12컬럼·같은 gap을 쓰므로 위 모자이크와 한 판으로 읽힌다. */
  .bento-foot{grid-auto-rows:auto;}
  .t-hist  {grid-column:1 / -1;}

  /* 고정 높이 타일 안에서 넘치는 목록만 스크롤한다 — 머리(제목·입력줄)와 발(요약·안내)은 늘 보인다.
     좌우 여백을 음수 마진으로 되돌려 스크롤 영역이 포커스 링을 자르지 않게 한다. */
  .tile{display:flex; flex-direction:column;}
  .tile-body{flex:1; min-height:0; overflow:auto; margin:0 -6px; padding:0 6px;}

  /* 작은 지표 타일 — 큰 hero 옆에서 숫자만 압축해 받는 자리.
     좁은 면적 × 40px 숫자의 대비가 이 화면의 "탁 띄는" 지점이다(색이 아니라 크기로). */
  .metric{justify-content:space-between; gap:6px;}
  .bento .card.metric{padding:16px 18px;}
  .metric .v{font-size:40px; font-weight:700; letter-spacing:-.035em; line-height:1; display:flex; align-items:baseline; gap:3px;}
  .metric .v u{font-size:14px; font-weight:600; color:var(--text-muted); text-decoration:none;}
  .metric .s{font-size:11.5px; color:var(--text-muted);}
  .metric.low .v{color:var(--danger-fg);}

  /* 과거 보고서 = 모자이크 아래를 받치는 가로로 긴 타일.
     타일 안에 카드(.hist-card)를 그대로 넣으면 둥근 상자가 이중으로 겹치므로,
     이 안에서만 테두리를 떼고 얇은 구분선으로 바꾼다(히스토리 탭의 같은 컴포넌트는 그대로). */
  .dash-list.flush{gap:0;}
  .dash-list.flush .hist-card{border:none; border-radius:12px; box-shadow:none;}
  .dash-list.flush .hist-card + .hist-card{border-top:1px solid var(--border-soft);}
  .dash-list.flush .hist-card:hover{background:var(--surface-sunken);}
  .dash-list.flush .hist-summary{padding:14px 10px;}

  /* 반응형: 폭이 모자라면 모자이크를 접는다.
     - ~1180px: 6컬럼. 행 스팬을 풀어(grid-row:auto) 타일이 제 내용 높이를 갖게 하고,
       고정 높이가 사라지므로 안쪽 스크롤도 끈다(스크롤 영역 안에 스크롤이 생기지 않게).
       지표 타일만 3칸씩 남겨 2×2 블록을 유지한다 — 이게 남아 있어야 벤토의 흔적이 유지된다.
     - ~700px: 2컬럼. 지표는 2개씩, 나머지는 전폭. */
  @media (max-width:1180px){
    .bento{grid-template-columns:repeat(6, minmax(0,1fr)); grid-auto-rows:auto;}
    .bento > *{grid-row:auto !important;}
    .t-hero, .t-daily, .t-todo{grid-column:span 6;}
    .t-metric, .t-mw, .t-proj{grid-column:span 3;}
    .tile-body{overflow:visible; margin:0; padding:0;}
  }
  @media (max-width:700px){
    .bento{grid-template-columns:repeat(2, minmax(0,1fr));}
    .t-hero, .t-daily, .t-todo, .t-mw, .t-proj{grid-column:span 2;}
    .t-metric{grid-column:span 1;}
  }

  .section-head{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .section-head h2{font-size:15px; font-weight:700; margin:0; letter-spacing:-.01em;}
  .link-more{
    border:none; background:transparent; color:var(--text-muted); cursor:pointer;
    font-size:12.5px; font-weight:600; padding:6px 10px; border-radius:9px;
    display:flex; align-items:center; gap:5px; transition:background .12s,color .12s;
  }
  .link-more:hover{background:var(--surface-sunken); color:var(--accent);}
  .link-more:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  /* 이번 주 타일 = 벤토에서 가장 큰 면적이자 화면의 유일한 강한 CTA 자리(accent .btn은 화면에 하나만).
     v6까지 여기 있던 숫자(시간/맨위크/건수)는 옆의 작은 지표 타일로 옮겼다 — 큰 타일이 숫자를 붙들고 있으면
     작은 타일이 압축 요약을 할 일이 없어져 모자이크가 성립하지 않는다.
     대신 큰 면적은 "이번 주가 어떻게 흘러갔나"를 보여주는 요일 스트립이 채운다(큰 타일이 텅 비면 안 된다). */
  .hero{gap:16px; justify-content:space-between;}
  .hero-top{display:flex; align-items:flex-start; justify-content:space-between; gap:18px; flex-wrap:wrap;}
  .hero-left{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .kicker{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint);}
  .hero-title{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  /* 20 → 30px: 타일이 커진 만큼 제목도 커져야 "큰 타일"이 여백이 아니라 위계로 읽힌다 */
  .hero-title .wk{font-size:30px; font-weight:700; letter-spacing:-.03em; line-height:1.1;}
  .hero-title .rng, .hero-sub{font-size:12.5px; color:var(--text-muted);}
  .hero-note{font-size:12.5px; color:var(--text-muted); margin:0; max-width:460px;}

  /* 요일 스트립 = 이 주(금~목) 7일의 기록 시간 미니 막대.
     새 색을 쓰지 않는다 — 채워진 날은 --accent, 빈 날은 --surface-sunken, 오늘만 --accent 테두리. */
  .wk-days{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:8px; margin-top:auto;}
  .wk-day{
    border:1px solid var(--border-soft); border-radius:12px; padding:9px 5px 8px;
    display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0;
    transition:border-color .12s;
  }
  .wk-day .dw{font-size:11px; font-weight:700; color:var(--text-faint);}
  .wk-day .bar-v{width:100%; height:38px; border-radius:8px; background:var(--surface-sunken); display:flex; align-items:flex-end; overflow:hidden;}
  .wk-day .bar-v > i{display:block; width:100%; background:var(--accent); border-radius:8px;}
  .wk-day .hh{font-size:11px; font-weight:700; color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .wk-day.empty .hh{color:var(--text-faint); font-weight:400;}
  .wk-day.today{border-color:var(--accent);}
  .wk-day.today .dw{color:var(--accent-soft-fg);}

  .badge.draft{background:var(--accent-soft); color:var(--accent-soft-fg);}
  .badge.idle{background:var(--surface-sunken); color:var(--text-muted);}

  .bar{height:5px; border-radius:999px; background:var(--surface-sunken); overflow:hidden;}
  .bar > i{display:block; height:100%; border-radius:999px; background:var(--accent);}
  .bar.low > i{background:var(--danger-border);}

  .mw-big{font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1.15; margin-top:8px;}
  .mw-big.low{color:var(--danger-fg);}
  .mw-sub{font-size:12px; color:var(--text-muted); margin-top:3px;}
  .mw-weeks{display:flex; flex-direction:column; gap:12px; margin-top:18px; padding-top:16px; border-top:1px solid var(--border-soft);}
  .mw-week{display:flex; flex-direction:column; gap:6px;}
  .mw-week .top{display:flex; justify-content:space-between; align-items:baseline; font-size:12px;}
  .mw-week .top .lb{color:var(--text-muted);}
  .mw-week .top .vl{font-weight:700;}
  .mw-week .top .vl.low{color:var(--danger-fg);}

  .proj-row{display:flex; flex-direction:column; gap:8px; padding:14px 0; border-bottom:1px solid var(--border-soft);}
  .proj-row:last-child{border-bottom:none;}
  .proj-top{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
  .proj-top .nm{font-size:13.5px; font-weight:600;}
  .proj-top .tk{font-size:11.5px; color:var(--text-muted); background:var(--surface-sunken); padding:2px 9px; border-radius:999px;}
  .proj-top .pc{margin-left:auto; font-size:13px; font-weight:700;}
  .proj-meta{font-size:11.5px; color:var(--text-faint);}

  .dash-list{display:flex; flex-direction:column; gap:12px;}

  /* ---------- TODO 리스트(전망형) ---------- */
  /* "오늘 한 일"(회고)과 정확히 반대 축의 목록이다. 절대 섞지 않는다:
     - 완료해도 '한 일 기록'으로 넘어가지 않고, .md 내보내기에도 나가지 않는 순수 개인 목록이다.
     - 그래서 이 블록 어디에도 "기록"이라는 단어를 쓰지 않는다("할 일"로 통일).
     - 카드 제목은 **"TODO 리스트"로 확정**(v6의 "앞으로 할 일"은 사용자가 기각). 한국어 제목끼리
       "한 일 / 할 일"로 한 글자 차이가 나던 문제도 영문 TODO가 자연히 해결한다.
     자리는 벤토 우측의 세로로 가장 긴 타일(4×10). 폭이 352px(내부 296px)이라 날짜를 행마다 반복할 수 없어서,
     날짜는 좌측 패널이 이미 쓰는 .day-group/.day-head(날짜 헤더 + 그 아래 항목들)를 그대로 재사용해
     그룹 헤더가 대신 받는다. 기한이 지난 것들만 날짜가 제각각이라 그 그룹에서만 행마다 날짜 칩을 붙인다. */
  .day-head.over{color:var(--danger-fg);}
  .day-head .n{margin-left:auto; font-weight:700; letter-spacing:0;}

  .todo-row{border-bottom:1px solid var(--border-soft); padding:6px 0;}
  .todo-row:last-child{border-bottom:none;}
  .todo-item{display:flex; align-items:flex-start; gap:6px;}
  .todo-check{flex:none; width:15px; height:15px; margin:4px 0 0; accent-color:var(--accent); cursor:pointer;}
  /* 기한 지난 항목만 행 앞에 날짜 칩 — "얼마나 밀렸나"가 이 그룹에서만 항목마다 다르기 때문 */
  .t-wrap{flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:flex-start; gap:4px;}
  .t-wrap .od{
    flex:none; margin-top:4px; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:999px;
    background:var(--danger-bg); color:var(--danger-fg); font-variant-numeric:tabular-nums;
  }
  /* 좁은 카드라 할 일 문장이 잘리면 목록의 의미가 없다 — 좌측 기록과 같은 줄바꿈 textarea(.d-txt) 규칙 */
  .t-txt{
    flex:1; min-width:80px; display:block; resize:none; overflow:hidden;
    border:1px solid transparent; border-radius:8px; padding:3px 5px; font-size:13px; line-height:1.45;
    background:transparent; transition:background .12s,border-color .12s;
  }
  .t-txt:hover{background:var(--surface-sunken);}
  .t-txt:focus{border-color:var(--accent); background:var(--surface-sunken); outline:none;}
  .todo-row.done .t-txt{text-decoration:line-through; color:var(--text-faint);}

  /* 우선순위 = 표시와 편집을 겸하는 pill 하나(클릭하면 높음→보통→낮음 순환).
     기본값 '보통'은 조용하게, 벗어난 '높음'만 색이 붙는다 — 목록 전체가 배지밭이 되지 않게. */
  .prio{
    flex:none; margin-top:3px; border:1px solid transparent; border-radius:999px; padding:2px 7px;
    font-size:10.5px; font-weight:700; background:transparent; color:var(--text-faint); cursor:pointer;
    white-space:nowrap; transition:background .12s,color .12s,border-color .12s;
  }
  .prio:hover{background:var(--surface-sunken); color:var(--text-muted);}
  .prio:focus-visible{border-color:var(--accent); outline:none;}
  .prio.high{background:var(--warn-bg); color:var(--warn-fg);}
  .prio.mid{color:var(--text-muted);}
  /* 달력 버튼은 .icon-btn.chevron의 중립 hover만 빌려 쓴다 — 회전(펼침 표시)은 달력 아이콘엔 안 맞아 끈다 */
  .todo-item .icon-btn{margin-top:1px;}
  .todo-item .icon-btn.chevron.open{background:var(--surface-sunken); color:var(--text);}
  .todo-item .icon-btn.chevron.open svg{transform:none;}
  /* 기한 변경은 자주 하는 조작이 아니라 행을 늘리지 않는다 — 보고 항목의 일정 상세(.row-detail)와 같은 접이식 */
  .todo-row .row-detail{margin-top:6px; padding:10px 12px;}
  .todo-row .row-detail label.inline input{width:150px;}

  .todo-foot{display:flex; margin-top:8px;}
  .todo-done{margin-top:8px; padding-top:6px; border-top:1px solid var(--border-soft);}

  /* ---------- 일일 기록(한 일) ---------- */
  /* 회고적 기록 — "앞으로 할 일"이 아니라 "한 일"만 담는다(일정관리 아님).
     ⚠️ v3에서 성격이 바뀌었다: 주간보고로 올리는 체크박스·대상 선택·반영 상태가 전부 사라졌고,
     이 목록은 주간보고를 쓸 때 옆에 두고 **보는 참고 자료**다. 프로그램은 기록을 옮겨주지 않는다.
     그래서 기록에 가능한 조작은 추가 / 수정 / 삭제 셋뿐이고, 항목당 부가 UI(체크·화살표·칩)가 없다. */
  /* 좌우 분할이 켜지면 페이지 폭을 넓힌다 — 그대로 두면 항목 행(티켓·제목·구분·시간·일수·진행률·배지)이
     오른쪽 컬럼에서 두 줄로 접혀 "한 줄 = 한 항목"이라는 이 화면의 시각 규칙이 깨진다.

     v5(2026-08-14): 사용자 요청 "이번 주에 한 일 영역이 지금보다 100% 더 컸으면" → 패널 340 → **680px**.
     우측 컬럼의 하한은 v3에서 실측한 항목 행 최소 폭에서 나온다:
        배지 없이 752px / 완료+이월 배지가 같이 붙으면 860px(이월 배지는 초안 생성 시 항목마다
        붙는 정상 상태라 예외 취급 불가) + 카드 좌우 패딩 56  =>  **우측 컬럼 916px가 하한**
        56(main 패딩) + 680(패널) + 18(gap) + 916(우측 하한) = 1670px
     그래서 확장 폭을 1400 → 1670px으로 올린다.

     다만 1670px은 모든 화면에 있는 폭이 아니다 — 1920 모니터를 Windows 125% 배율로 쓰면 CSS 폭은
     1536px뿐이다(실측: 이 개발기의 주 모니터 2560px / 보조 노트북 1536px). 그래서 패널 폭을 고정하지 않고
     **우측 916px를 먼저 보장한 뒤 남는 폭을 전부 패널이 가져가는** 유동 규칙으로 쓴다:
        minmax(0,680px)   패널은 680px까지만 커지고, 폭이 모자라면 자기가 대신 줄어든다
        minmax(916px,1fr) 우측 컬럼은 916px 밑으로 절대 안 내려간다(= 행이 두 줄로 안 접힌다)
     결과 → 뷰포트 1670px↑ : 패널 680px(요청대로 정확히 2배) / 1536px 노트북 : 530px(+56%) / 그 사이는 연속.
     행이 접히는 대신 패널이 줄어드는 것이므로, v4보다 시각 규칙이 오히려 더 넓은 폭 구간에서 지켜진다.
     1280px 미만에서는 패널이 290px 밑으로 내려가 v3에서 검증한 하한(300px)도 못 지키므로 세로 스택으로 넘긴다
     (스택되면 좌우 폭 경쟁이 없어져 패널은 그 폭 그대로 한 줄을 다 쓴다 — 680px 상한은 분할일 때만 의미가 있다). */
  body.wide main{max-width:1670px;}
  body.wide .header-inner{max-width:1650px;}
  .split{display:grid; grid-template-columns:minmax(0,680px) minmax(916px,1fr); gap:18px; align-items:start;}
  .split-main{display:flex; flex-direction:column; gap:22px; min-width:0;}
  /* 작성 폼이 길어도 왼쪽 기록은 따라온다 — 폼 어느 칸을 채우는 중이든 그 주에 뭘 했는지 보여야 한다 */
  .daily-panel{position:sticky; top:84px; max-height:calc(100vh - 108px); overflow:auto; padding:20px 20px 18px;}
  @media (max-width:1280px){
    .split{grid-template-columns:1fr;}
    .daily-panel{position:static; max-height:none; overflow:visible;}
  }

  .daily-head{display:flex; align-items:center; justify-content:space-between; gap:10px;}

  .day-group{margin-top:14px;}
  .day-head{
    display:flex; align-items:center; gap:8px; padding-bottom:5px; border-bottom:1px solid var(--border-soft);
    font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--text-faint);
  }
  .day-head .today-chip{background:var(--accent-soft); color:var(--accent-soft-fg); padding:1px 7px; border-radius:999px; font-size:10px;}
  /* 그날 기록한 시간의 합. 시간은 선택 입력이라 합계가 0이면 아예 안 그린다(0h를 들이밀어 입력을 압박하지 않는다).
     날짜 헤더에 붙는 이유: "그날 8시간 중 몇 시간이 잡혔나"가 한눈에 보여야 기록이 빠진 날을 스스로 알아챈다. */
  /* v5: 패널이 넓어지면서 날짜 라벨과 합계가 멀리 떨어지게 됐다 — 그냥 오른쪽 끝에 붙이면 둘의 관계가 흐려진다.
     삭제 버튼(25) + gap(6) + 단위 여백(2)만큼 안쪽으로 들여 **아래 시간 칸들의 'h'와 세로로 정확히 맞춘다.**
     넓어진 폭이 여백이 아니라 "합계 = 이 열의 합"이라는 표 구조를 만들도록 쓰는 것. */
  .day-head .day-sum{margin-left:auto; padding-right:33px; font-weight:700; letter-spacing:0; color:var(--text-muted); font-variant-numeric:tabular-nums;}

  .daily-item{display:flex; align-items:flex-start; gap:6px; padding:6px 0; border-bottom:1px solid var(--border-soft);}
  .daily-item:last-child{border-bottom:none;}
  .daily-item .icon-btn{margin-top:2px;}
  /* 텍스트가 여러 줄로 감겨도 시간 칸과 단위는 첫 줄에 정렬된 채로 남는다 */
  .daily-item .hours-input{flex:none; margin-top:1px;}
  .daily-item .unit{margin-top:5px; flex:none;}
  /* 읽으라고 있는 목록이므로 긴 기록이 잘리면 목적을 잃는다 — 한 줄 input 대신 줄바꿈되는 textarea.
     평상시 테두리 없이 텍스트처럼 보이다 hover/focus 시 강조되는 기존 인풋 규칙은 그대로 따른다. */
  .d-txt{
    flex:1; min-width:0; display:block; resize:none; overflow:hidden;
    border:1px solid transparent; border-radius:8px; padding:4px 6px; font-size:13px; line-height:1.45;
    background:transparent; transition:background .12s,border-color .12s;
  }
  .d-txt:hover{background:var(--surface-sunken);}
  .d-txt:focus{border-color:var(--accent); background:var(--surface-sunken); outline:none;}

  .daily-foot{
    margin-top:16px; padding-top:13px; border-top:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    font-size:12px; color:var(--text-muted);
  }
  .daily-foot b{color:var(--text); font-weight:700;}
  .daily-note, .todo-note{font-size:11.5px; color:var(--text-faint); margin:10px 0 0; line-height:1.5;}

  /* 기록 추가 입력 — 여기만 "텍스트처럼 보이는 인풋" 규칙의 예외(설계 근거 참고).

  function weekDays(wk){ return Array.from({length:7}, (_, i) => addDays(wk.start, i)); }
  function dayLabel(iso){
    const d = new Date(iso + "T00:00:00");
    return `${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} (${DOW[d.getDay()]})`;
  }

  /**
   * 일일 기록 = { id, date, text, hours } — 이게 전부다.
   * 주간보고 항목과의 연결(promoted/target/linked)은 v3에서 전부 제거했다.
   * 사용자 판단: 자유 텍스트 한 줄이 프로젝트로 갈지 개발/기타로 갈지 정리하는 규칙이 모호하고,
   * 요일마다 다르게 적은 기록을 하나의 보고 항목으로 합치는 개념도 모호하다 →
   * 프로그램이 옮겨주지 않고, 사람이 이 목록을 **보면서** 오른쪽 폼에 직접 항목을 만든다.
   *
   * v4에서 hours 추가 — "나중에 기억 안 남"을 막는 게 이 기능의 존재 이유인데, 텍스트만 남기면
   * 정작 보고에 필요한 숫자(시간)를 주 끝에 다시 기억해내야 했다. **선택 입력**이다:
   * 매번 정확히 재는 게 아니라 대략치를 흘려 적어두는 자리라, 필수로 만들면 "가볍게 기록"이 깨진다.
   * 그래서 아래 데모 데이터에도 시간이 빈 기록이 섞여 있다(정상 상태).
   */
  const DAILY = [
    { id: nextId(), date:"2026-07-31", text:"2차인증 프로세스 개선 요건 정리", hours:1 },
    { id: nextId(), date:"2026-08-03", text:"파트 주간회의", hours:1 },
    { id: nextId(), date:"2026-08-04", text:"GTPP 배포 스크립트 점검", hours:2 },

    { id: nextId(), date:"2026-08-07", text:"GTPP 결제 연동 테스트 케이스 작성", hours:3 },
    { id: nextId(), date:"2026-08-07", text:"파트 주간회의", hours:1 },
    { id: nextId(), date:"2026-08-10", text:"GTPP 결제 로그 분석 — 타임아웃 원인 확인", hours:4 },
    { id: nextId(), date:"2026-08-10", text:"2차인증 리뉴얼 로그인 화면 검토", hours:2 },
    { id: nextId(), date:"2026-08-11", text:"OTP 발송 모듈 개발", hours:5 },
    { id: nextId(), date:"2026-08-11", text:"신입 온보딩 질문 대응", hours:"" },
    { id: nextId(), date:"2026-08-12", text:"GTPP 외부 연계사 일정 협의", hours:1.5 },
    { id: nextId(), date:"2026-08-12", text:"OTP 재발송 예외 처리", hours:3 },
    { id: nextId(), date:"2026-08-13", text:"결제 배치 실패 건 재처리", hours:2 },
  ];

  let dailyVisible = true;     // 작성 화면 좌측 패널 표시 여부(안 쓰는 사람은 접어두고 폼을 넓게)

  function dailyOf(wk){
    const days = weekDays(wk);
    return DAILY.filter(e => days.includes(e.date)).sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id);
  }
  function dailyEntry(id){ return DAILY.find(e => e.id === id) || null; }

  /** 시간은 선택 입력이라 합계에 빈 값이 섞인다 — 0으로 취급해 더하고, 소수점 뒷자리 0은 떼서 보여준다(8.5h / 4h). */
  function sumHours(list){ return list.reduce((n, e) => n + (Number(e.hours) || 0), 0); }
  function fmtHours(n){ return Number(n.toFixed(2)).toString(); }
  function hoursTag(list){ const h = sumHours(list); return h > 0 ? `${fmtHours(h)}h` : ""; }

  const $ = sel => document.querySelector(sel);
  const dashboardView = $("#dashboardView");
  const writeView = $("#writeView");
  const historyView = $("#historyView");

  function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function phaseOptions(sel){
    return `<option value="">-</option>` + PHASES.map(p => `<option ${p===sel?"selected":""}>${p}</option>`).join("");
  }

  // 맨위크 = (시간 × 일수) / 5 / 8, 일수 생략 시 1로 간주 (docs/weekly-report-md-schema.md 기준)
  function computeTotals(wk){
    const withDays = i => (Number(i.hours)||0) * (Number(i.days) || 1);
    let totalHours = 0;
    (wk.projects||[]).forEach(p => (p.subitems||[]).forEach(i => totalHours += withDays(i)));
    (wk.dev||[]).forEach(i => totalHours += withDays(i));
    (wk.etc||[]).forEach(i => totalHours += Number(i.hours)||0);
    (wk.vacation||[]).forEach(i => totalHours += Number(i.hours)||0);
    const manWeek = totalHours / 40;
    return { totalHours, manWeek: manWeek.toFixed(2), low: manWeek < LOW_MANWEEK_THRESHOLD };
  }

  function itemRow(item){
    const detailId = "d" + item.id;
    return `
      <div class="row" data-id="${item.id}">
        <div class="row-main">
          <input class="ticket" type="text" value="${esc(item.ticket)}" placeholder="티켓번호" data-field="ticket">
          <input class="title-input" type="text" value="${esc(item.title)}" placeholder="업무명" data-field="title">
          <select class="phase-select" data-field="phase">${phaseOptions(item.phase)}</select>
          <span class="unit">시간</span>
