          <input class="days-input tabular" type="number" step="1" min="1" placeholder="1" title="투입일수 (비우면 1일)" value="${item.days ?? ""}" data-field="days">
          <span class="unit">일</span>
          <div class="pct-wrap">
            <input class="completion-input tabular" type="number" min="0" max="100" value="${item.completion ?? ""}" data-field="completion">
            <span class="unit" style="margin:0;">%</span>
          </div>
          ${item.carriedOver ? '<span class="badge carry">이월</span>' : ""}
          ${Number(item.completion) === 100 ? '<span class="badge done">완료</span>' : ""}
          <button class="icon-btn chevron" data-toggle="${detailId}" title="일정·비고">${ICON_CAL}</button>
          <button class="icon-btn" data-remove title="삭제">${ICON_TRASH}</button>
        </div>
        <div class="row-detail" id="${detailId}">
          <label class="inline">개발완료일<input type="date" value="${esc(item.devDoneDate)}" data-field="devDoneDate"></label>
          <label class="inline">테스트예정일<input type="date" value="${esc(item.testDate)}" data-field="testDate"></label>
          <label class="inline">배포예정일<input type="date" value="${esc(item.deployDate)}" data-field="deployDate"></label>
          <label class="note-field">비고<input type="text" value="${esc(item.note)}" placeholder="일정 변경 사유 등" data-field="note"></label>
        </div>
      </div>`;
  }

  // 휴가는 하루짜리(date만)와 기간짜리(date~endDate)를 행마다 토글로 전환할 수 있다.
  // 기간으로 전환해도 항목 개수는 그대로 1건 — 시간은 기간 전체 합산치를 사용자가 직접 입력.
  function simpleRow(item, kind){
    if (kind === "vacation"){
      const isPeriod = !!item.period;
      return `<div class="row" data-id="${item.id}"><div class="simple-row">
        <input type="date" value="${esc(item.date)}" data-field="date">
        ${isPeriod ? `<span class="unit">~</span><input type="date" value="${esc(item.endDate)}" data-field="endDate">` : ""}
        <button class="mode-toggle" type="button" data-toggle-period>${isPeriod ? "하루로" : "기간으로"}</button>
        <span class="unit">시간</span>
        <input class="hours-input tabular" type="number" step="0.5" value="${item.hours ?? ""}" data-field="hours">
        <button class="icon-btn" data-remove title="삭제" style="margin-left:auto;">${ICON_TRASH}</button>
      </div></div>`;
    }
    return `<div class="row" data-id="${item.id}"><div class="simple-row">
      <input class="title-input" type="text" value="${esc(item.title)}" placeholder="업무명" data-field="title">
      <span class="unit">시간</span>
      <input class="hours-input tabular" type="number" step="0.5" value="${item.hours ?? ""}" data-field="hours">
      <button class="icon-btn" data-remove title="삭제">${ICON_TRASH}</button>
    </div></div>`;
  }

  function itemHeaderRow(){
    return `
      <div class="row-head">
        <span class="ticket">일감번호</span>
        <span class="title-input">제목</span>
        <span class="phase-select">구분</span>
        <span class="hours-input" style="text-align:left;">투입시간</span>
        <span class="days-input" style="text-align:left; width:auto;">일수</span>
        <span>진행률</span>
      </div>`;
  }

  function subitemHeaderRow(){
    return `
      <div class="row-head">
        <span class="title-input">세부 업무명</span>
        <span class="phase-select">구분</span>
        <span class="hours-input" style="text-align:left;">투입시간</span>
        <span class="days-input" style="text-align:left; width:auto;">일수</span>
        <span>진행률</span>
      </div>`;
  }

  /**
   * 프로젝트(=일감 하나) 안의 세부 항목 1줄. 티켓번호는 프로젝트 카드 헤더에만 있고 여기엔 없음.
   * 구분은 고정 슬롯이 아니라 선택형이라 같은 구분(예: 개발)을 여러 개 추가할 수 있음
   * (예: 한 프로젝트에 "로그인 기능"·"2차인증 기능" 두 개발 항목).
   */
  function projectSubitemRow(projectId, item){
    const detailId = "d" + item.id;
    return `
      <div class="row" data-project-id="${projectId}" data-item-id="${item.id}">
        <div class="row-main">
          <input class="title-input" type="text" value="${esc(item.title)}" placeholder="세부 업무명 (예: 로그인 기능)" data-field="title">
          <select class="phase-select" data-field="phase">${phaseOptions(item.phase)}</select>
          <span class="unit">시간</span>
          <input class="hours-input tabular" type="number" step="0.5" value="${item.hours ?? ""}" data-field="hours">
          <span class="unit">·</span>
          <input class="days-input tabular" type="number" step="1" min="1" placeholder="1" title="투입일수 (비우면 1일)" value="${item.days ?? ""}" data-field="days">
          <span class="unit">일</span>
          <div class="pct-wrap">
            <input class="completion-input tabular" type="number" min="0" max="100" value="${item.completion ?? ""}" data-field="completion">
            <span class="unit" style="margin:0;">%</span>
          </div>
          ${item.carriedOver ? '<span class="badge carry">이월</span>' : ""}
          ${Number(item.completion) === 100 ? '<span class="badge done">완료</span>' : ""}
          <button class="icon-btn chevron" data-toggle="${detailId}" title="일정·비고">${ICON_CAL}</button>
          <button class="icon-btn" data-remove-subitem title="삭제">${ICON_TRASH}</button>
        </div>
        <div class="row-detail" id="${detailId}">
          <label class="inline">개발완료일<input type="date" value="${esc(item.devDoneDate)}" data-field="devDoneDate"></label>
          <label class="inline">테스트예정일<input type="date" value="${esc(item.testDate)}" data-field="testDate"></label>
          <label class="inline">배포예정일<input type="date" value="${esc(item.deployDate)}" data-field="deployDate"></label>
          <label class="note-field">비고<input type="text" value="${esc(item.note)}" placeholder="일정 변경 사유 등" data-field="note"></label>
        </div>
      </div>`;
  }

  /** 완료율<100인 단계만 다음 주로 이월 (기타/휴가 제외, dev 그룹 항목도 동일 규칙) — docs/project-handoff-summary.md 4.3 규칙 */
  function buildCarriedOverDraft(fromWeek, target){
    // start(주 시작일)를 반드시 물려받아야 한다 — 일일 기록은 날짜로 주에 소속되므로 이게 빠지면 그 주 기록이 통째로 사라져 보인다
    const draft = { status:"draft", label: target.label, range: target.range, start: target.start,
                    projects:[], dev:[], etc:[], vacation:[] };
    (fromWeek?.projects || []).forEach(p => {
      const carriedSubitems = (p.subitems || [])
        .filter(i => (Number(i.hours) > 0 || Number(i.completion) > 0) && Number(i.completion) < 100)
        .map(i => ({ ...blankSubitem(), title: i.title, phase: i.phase, completion: i.completion, carriedOver: true }));
      if (carriedSubitems.length){
        draft.projects.push({ id: nextId(), name: p.name, ticket: p.ticket, subitems: carriedSubitems });
      }
    });
    (fromWeek?.dev || []).filter(i => Number(i.completion) < 100).forEach(i => {
      draft.dev.push({ ...blankItem(), ticket: i.ticket, title: i.title, phase: i.phase, completion: i.completion, carriedOver: true });
    });
    return draft;
  }

  // ---------- 일일 기록 패널 (작성 화면 좌측) ----------
  /**
   * 기록 한 줄 = 텍스트 + 시간 + 삭제. 그게 전부다.
   * 체크박스·대상 셀렉트·반영 배지는 v3에서 제거했다 — 이 목록은 조작 대상이 아니라 참고 자료다.
   * 텍스트는 input이 아니라 줄바꿈되는 textarea다: 좁은 패널에서 긴 기록이 잘리면 "보면서 쓴다"는 목적이 깨진다.
   * 시간 칸은 주간보고 항목의 .hours-input을 그대로 쓴다(56px·우측정렬·h 단위) — 세 화면(대시보드/작성 패널/기록)
   * 어디서 보든 같은 컴포넌트여야 "이건 저기 그 시간 칸이다"가 학습 없이 읽힌다.
   */
  function dailyRowHtml(entry){
    return `
      <div class="daily-item" data-daily="${entry.id}">
        <textarea class="d-txt" rows="1" placeholder="한 일" data-daily-text>${esc(entry.text)}</textarea>
        <input class="hours-input tabular" type="number" step="0.5" min="0" value="${entry.hours ?? ""}"
               placeholder="-" title="투입시간 (선택)" data-daily-hours>
        <span class="unit">h</span>
        <button class="icon-btn" data-daily-remove title="기록 삭제">${ICON_TRASH}</button>
      </div>`;
  }

  /** 날짜 헤더 + 그날 기록. 작성 화면 패널·대시보드 카드·한 일 기록 화면이 전부 이걸 쓴다(세 화면의 기록 블록은 동일 컴포넌트다). */
  function dayGroupHtml(iso, entries, emptyText, labelFn){
    const sum = hoursTag(entries);
    return `
      <div class="day-group">
        <div class="day-head">
          <span>${(labelFn || dayLabel)(iso)}</span>
          ${iso === DEMO_TODAY ? '<span class="today-chip">오늘</span>' : ""}
          ${sum ? `<span class="day-sum">${sum}</span>` : ""}
        </div>
        ${entries.map(dailyRowHtml).join("") || (emptyText ? `<p class="empty-hint" style="padding:8px 0;">${emptyText}</p>` : "")}
      </div>`;
  }

  function dailyPanelHtml(wk){
    const days = weekDays(wk);
    const all = dailyOf(wk);

    // 기록이 있는 날 + (이번 주라면) 오늘 — 빈 주말 행으로 목록을 늘리지 않는다
    const dayList = days.filter(d => all.some(e => e.date === d) || d === DEMO_TODAY);

    const groups = dayList.map(d => dayGroupHtml(d, all.filter(e => e.date === d), "기록 없음")).join("")
      || `<p class="empty-hint" style="padding:14px 0;">이 주에 기록된 일이 없습니다.</p>`;

    // 지난 날에 빠뜨린 기록도 채울 수 있어야 하므로 날짜 선택이 붙은 입력 한 벌을 패널 하단에 상시 노출한다.
    // 보고서가 없는 주(status=empty)에서도 기록은 그대로 쓸 수 있다 — 기록은 주간보고에 의존하지 않는다.
    const defaultDate = days.includes(DEMO_TODAY) ? DEMO_TODAY : days[days.length - 1];
    const dateOptions = days.map(d => `<option value="${d}" ${d === defaultDate ? "selected" : ""}>${dayLabel(d)}</option>`).join("");

    const wkHours = hoursTag(all);
    return `
      <div class="card daily-panel">
        <div class="daily-head">
          <div class="card-title"><h2>${weekIdx === CURRENT_IDX ? "이번 주에 한 일" : esc(wk.label) + "에 한 일"}</h2><span class="count">${all.length}건${wkHours ? " · " + wkHours : ""}</span></div>
          <button class="link-more" id="hideDailyBtn" title="패널 숨기기">숨기기</button>
        </div>
        ${groups}
        <!-- v5: 패널이 680px가 되면서 [날짜][시간][텍스트]가 한 줄에 다 들어간다(텍스트 칸 약 450px).
             CSS를 바꿔서가 아니라 .quick-add의 flex-wrap + 텍스트 min-width:150px가 알아서 푼 결과다 —
             폭이 줄어 셋이 안 들어가면(패널 ~330px 이하) v4처럼 [날짜][시간] / [텍스트] 두 줄로 다시 감긴다.
             즉 넓어진 폭이 캡처 입력의 줄 수를 하나 줄여준다: 날짜·시간·내용을 눈 한 번에 확인하고 Enter. -->
        <div class="quick-add">
          <select class="date-sel" data-daily-newdate>${dateOptions}</select>
          <input class="qa-hours tabular" type="number" step="0.5" min="0" placeholder="시간" title="투입시간 (선택)" data-daily-newhours>
          <input type="text" data-daily-newtext placeholder="한 일 추가 (Enter)">
        </div>
        <p class="daily-note">오른쪽 주간보고를 쓸 때 참고하는 목록입니다. 기록이 항목으로 자동 옮겨지지는 않습니다.</p>
      </div>`;
  }

  function renderWrite(){
    const wk = WEEKS[weekIdx];
    document.body.classList.toggle("wide", dailyVisible);
    $("#weekLabel").innerHTML = esc(wk.label) + `<span class="range">${esc(wk.range)}</span>`;
    $("#prevWeekBtn").disabled = weekIdx === 0;
    $("#nextWeekBtn").disabled = weekIdx === WEEKS.length - 1;

    if (wk.status === "empty"){
      writeView.innerHTML = wrapSplit(wk, `
        <div class="empty-state">
          <div class="icon">${ICON_SPARK}</div>
          <h3>${esc(wk.label)} 보고서가 아직 없습니다</h3>
          <p>지난주 미완료 항목은 자동으로 이월되어 채워집니다. 새로 시작해보세요.</p>
          <button class="btn" id="startDraftBtn">이번 주 보고서 작성 시작</button>
        </div>`);
      wireDailyEvents(wk);
      $("#startDraftBtn").addEventListener("click", () => {
        const draft = buildCarriedOverDraft(WEEKS[weekIdx - 1], wk);
        WEEKS[weekIdx] = draft;
        renderWrite();
        showToast(draft.projects.length || draft.dev.length ? "보고서 초안을 만들었어요 (이월 항목 포함)" : "보고서 초안을 만들었어요");
      });
      return;
    }

    const body = [];

    // 추세 지표(최근 2주 평균 맨위크 / 진행중 프로젝트)는 대시보드로 옮겼고,
    // "작성" 탭 상단 통계는 지금 보고 있는 주 자체의 값만 보여준다 — 제출 전 맨위크 확인이 목적.
    const t = computeTotals(wk);
    const itemCount = (wk.projects || []).reduce((n, p) => n + (p.subitems || []).length, 0)
      + (wk.dev || []).length + (wk.etc || []).length + (wk.vacation || []).length;
    body.push(`
      <div class="stats">
        <div class="stat"><span class="k">총 투입시간</span><span class="v tabular">${t.totalHours}<small>h</small></span></div>
        <div class="stat"><span class="k">맨위크</span><span class="v tabular"${t.low ? ' style="color:var(--danger-fg);"' : ""}>${t.manWeek}</span></div>
        <div class="stat"><span class="k">항목 수</span><span class="v tabular">${itemCount}<small>건</small></span></div>
      </div>`);

    // 제출 여부는 참고 상태일 뿐, 지난 보고서도 항상 수정 + 재제출 가능
    if (wk.status === "submitted"){
      body.push(`<div class="locked-banner">${ICON_CHECK} 제출된 보고서입니다 — 수정 후 다시 내보낼 수 있습니다.</div>`);
    }

    body.push(`<div style="display:flex; flex-direction:column; gap:18px;">`);

    // 프로젝트 — 프로젝트당 일감(티켓)은 하나뿐이라 카드 헤더에 티켓번호를 바로 붙이고, 세부 항목은 그때그때 추가
    (wk.projects || []).forEach(proj => {
      body.push(`
        <div class="card" data-project="${proj.id}">
          <div class="card-head">
            <div class="card-title">
              <input class="ticket" type="text" value="${esc(proj.ticket)}" placeholder="티켓번호" data-project-ticket>
              <input class="name-edit" type="text" value="${esc(proj.name)}" data-project-name>
            </div>
            <span class="count">${proj.subitems.length}건</span>
          </div>
          ${proj.subitems.length ? subitemHeaderRow() : ""}
          <div class="rows" data-subitems>${proj.subitems.map(i => projectSubitemRow(proj.id, i)).join("") || `<p class="empty-hint">아직 항목이 없습니다.</p>`}</div>
          <button class="ghost" data-add-subitem>+ 항목 추가</button>
        </div>`);
    });
    body.push(`<button class="ghost" data-add-project style="align-self:flex-start;">+ 새 프로젝트</button>`);

    // 개발
    body.push(`
      <div class="card" data-group="dev">
        <div class="card-head"><div class="card-title"><h2>개발</h2><span class="count">${wk.dev.length}건</span></div></div>
        ${wk.dev.length ? itemHeaderRow() : ""}
        <div class="rows" data-items>${wk.dev.map(i => itemRow(i)).join("")}</div>
        <button class="ghost" data-add-item>+ 항목 추가</button>
      </div>`);

    // 기타
    body.push(`
      <div class="card" data-group="etc">
        <div class="card-head"><div class="card-title"><h2>기타</h2><span class="count">${wk.etc.length}건</span></div></div>
        <div class="rows" data-items>${wk.etc.map(i => simpleRow(i,"etc")).join("")}</div>
        <button class="ghost" data-add-item>+ 항목 추가</button>
      </div>`);

    // 휴가
    body.push(`
      <div class="card" data-group="vacation">
        <div class="card-head"><div class="card-title"><h2>휴가</h2><span class="count">${wk.vacation.length}건</span></div></div>
        <div class="rows" data-items>${wk.vacation.map(i => simpleRow(i,"vacation")).join("")}</div>
        <button class="ghost" data-add-item>+ 항목 추가</button>
      </div>`);

    body.push(`</div>`);

    const submitLabel = wk.status === "submitted" ? "다시 내보내기" : "제출하기";
    body.push(`<div class="submit-bar"><button class="btn" id="submitBtn">${submitLabel}</button></div>`);

    writeView.innerHTML = wrapSplit(wk, body.join(""));
    wireWriteEvents(wk);
    wireDailyEvents(wk);
  }

  /**
   * 작성 화면 = 좌우 분할. 왼쪽 "한 일"(참고 자료) 옆에서 오른쪽 "주간보고"(결과물)를 사람이 직접 채운다.
   * 둘 사이에 자동 연결은 없다 — 분할의 목적은 옮기는 동선이 아니라 "보면서 쓰는" 시야 확보다.
   * 패널을 숨기면 기존 단일 컬럼 화면과 똑같아진다 — 일일 기록을 안 쓰는 사람에게 강요되지 않는다.
   */
  function wrapSplit(wk, mainHtml){
    if (!dailyVisible){
      return `<div class="split-main">
        <button class="ghost" id="showDailyBtn" style="margin-top:0;">${ICON_NOTE_SM} 한 일 기록 보기</button>
        ${mainHtml}
      </div>`;
    }
    return `<div class="split">${dailyPanelHtml(wk)}<div class="split-main">${mainHtml}</div></div>`;
  }

  function wireWriteEvents(wk){
    writeView.querySelectorAll("[data-toggle]").forEach(btn => {
      btn.addEventListener("click", () => {
        const panel = document.getElementById(btn.dataset.toggle);
        panel.classList.toggle("open");
        btn.classList.toggle("open");
      });
    });

    // dev/etc/vacation 항목 (data-id를 가진 .row만 대상 — 프로젝트 세부 항목행(.row[data-project-id])은 아래에서 별도 처리)
    writeView.querySelectorAll(".row[data-id] [data-field]").forEach(el => {
      el.addEventListener("input", () => {
        const row = el.closest(".row");
        const id = Number(row.dataset.id);
        const field = el.dataset.field;
        const val = el.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value;
        applyFieldToState(wk, id, field, val);
        if (field === "completion") toggleDoneBadge(row, val);
      });
    });

    writeView.querySelectorAll("[data-remove]").forEach(btn => {
      btn.addEventListener("click", () => {
        const row = btn.closest(".row");
        const id = Number(row.dataset.id);
        removeFromState(wk, id);
        row.remove();
      });
    });

    writeView.querySelectorAll(".row[data-id]").forEach(row => wireVacationToggle(row, wk));

    writeView.querySelectorAll("[data-add-item]").forEach(btn => {
      btn.addEventListener("click", () => {
        const card = btn.closest(".card");
        const itemsEl = card.querySelector("[data-items]");
        const group = card.dataset.group;
        const item = group === "vacation" ? { id: nextId(), date:"", endDate:"", period:false, hours:"" } : group === "etc" ? { id: nextId(), title:"", hours:"" } : blankItem();
        wk[group].push(item);
        if (group === "dev" && !card.querySelector(".row-head")) itemsEl.insertAdjacentHTML("beforebegin", itemHeaderRow());
        itemsEl.insertAdjacentHTML("beforeend", group === "dev" ? itemRow(item) : simpleRow(item, group));
        wireRowOnce(itemsEl.lastElementChild, wk);
        card.querySelector(".count").textContent = wk[group].length + "건";
      });
    });

    // 프로젝트 세부 항목 필드
    writeView.querySelectorAll(".row[data-project-id] [data-field]").forEach(el => {
      el.addEventListener("input", () => {
        const row = el.closest(".row");
        const item = findSubitem(wk, Number(row.dataset.projectId), Number(row.dataset.itemId));
        if (!item) return;
        const field = el.dataset.field;
        const val = el.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value;
        item[field] = val;
        if (field === "completion") toggleDoneBadge(row, val);
      });
    });

    writeView.querySelectorAll("[data-remove-subitem]").forEach(btn => {
      btn.addEventListener("click", () => {
        const row = btn.closest(".row");
        const proj = wk.projects.find(p => p.id === Number(row.dataset.projectId));
        if (proj) proj.subitems = proj.subitems.filter(i => i.id !== Number(row.dataset.itemId));
        row.remove();
      });
    });

    writeView.querySelectorAll("[data-add-subitem]").forEach(btn => {
      btn.addEventListener("click", () => {
        const card = btn.closest(".card");
        const proj = wk.projects.find(p => p.id === Number(card.dataset.project));
        const item = blankSubitem();
        proj.subitems.push(item);
        const holder = card.querySelector("[data-subitems]");
        holder.querySelector("p")?.remove();
        if (!card.querySelector(".row-head")) holder.insertAdjacentHTML("beforebegin", subitemHeaderRow());
        holder.insertAdjacentHTML("beforeend", projectSubitemRow(proj.id, item));
        wireSubitemRowOnce(holder.lastElementChild, wk);
        card.querySelector(".count").textContent = proj.subitems.length + "건";
      });
    });

    writeView.querySelectorAll("[data-project-ticket]").forEach(el => {
      el.addEventListener("input", () => {
        const proj = wk.projects.find(p => p.id === Number(el.closest(".card").dataset.project));
        if (proj) proj.ticket = el.value;
      });
    });

    const addProjectBtn = writeView.querySelector("[data-add-project]");
    if (addProjectBtn){
      addProjectBtn.addEventListener("click", () => {
        const proj = { id: nextId(), name: "새 프로젝트", ticket: "", subitems: [] };
        wk.projects.push(proj);
        renderWrite();
      });
    }

    writeView.querySelectorAll("[data-project-name]").forEach(el => {
      el.addEventListener("input", () => {
        const id = Number(el.closest(".card").dataset.project);
        const proj = wk.projects.find(p => p.id === id);
        if (proj) proj.name = el.value;
      });
    });

    const submitBtn = $("#submitBtn");
    if (submitBtn) submitBtn.addEventListener("click", () => openPreview(wk));
  }

  /** 한 줄짜리 textarea가 내용 높이에 맞게 늘어나도록. 긴 기록이 잘리지 않고 전부 보이는 게 이 목록의 목적이다. */
  function autoGrow(el){
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }
  /**
   * 기록 행의 인라인 편집(텍스트 + 시간). onSum은 시간이 바뀌었을 때 날짜 헤더 합계를 다시 그리라는 콜백이다.
   * 실제 앱에서는 이 저장이 hx-swap="none"이라 화면이 다시 그려지지 않으므로,
   * 합계 갱신은 app.js가 클라이언트에서 해야 한다(완료율 100% "완료" 배지와 같은 자리).
   */
  function wireDailyFields(scope, onSum){
    scope.querySelectorAll("[data-daily-text]").forEach(el => {
      autoGrow(el);
      el.addEventListener("input", () => {
        autoGrow(el);
        const entry = dailyEntry(Number(el.closest("[data-daily]").dataset.daily));
        if (entry) entry.text = el.value;
      });
      // 기록은 한 줄짜리 메모다 — Enter로 줄을 늘리는 대신 편집을 끝낸다
      el.addEventListener("keydown", ev => { if (ev.key === "Enter"){ ev.preventDefault(); el.blur(); } });
    });
    scope.querySelectorAll("[data-daily-hours]").forEach(el => {
      el.addEventListener("input", () => {
        const entry = dailyEntry(Number(el.closest("[data-daily]").dataset.daily));
        if (!entry) return;
        entry.hours = el.value === "" ? "" : Number(el.value);
        onSum?.(el);
      });
    });
  }

  /** 날짜 헤더의 합계만 다시 계산해 갈아끼운다 — 입력 포커스를 잃지 않으려고 행 전체를 다시 그리지 않는다. */
  function refreshDaySum(inputEl){
    const group = inputEl.closest(".day-group");
    if (!group) return;
    const ids = [...group.querySelectorAll("[data-daily]")].map(el => Number(el.dataset.daily));
    const sum = hoursTag(DAILY.filter(e => ids.includes(e.id)));
    const head = group.querySelector(".day-head");
    let el = head.querySelector(".day-sum");
    if (!sum){ el?.remove(); return; }
    if (!el){ el = document.createElement("span"); el.className = "day-sum"; head.appendChild(el); }
    el.textContent = sum;
  }

  /**
   * 일일 기록 패널 이벤트 — 추가 / 수정 / 삭제, 셋뿐이다.
   * 주간보고 쪽으로 흘러가는 동작(승격·해제·대상 변경)은 v3에서 전부 없앴으므로 여기서 wk를 건드리지 않는다.
   */
  function wireDailyEvents(wk){
    $("#hideDailyBtn")?.addEventListener("click", () => { dailyVisible = false; renderWrite(); });
    $("#showDailyBtn")?.addEventListener("click", () => { dailyVisible = true; renderWrite(); });

    wireDailyFields(writeView, refreshDaySum);

    writeView.querySelectorAll("[data-daily-remove]").forEach(btn => btn.addEventListener("click", () => {
      removeDaily(Number(btn.closest("[data-daily]").dataset.daily));
      renderWrite();
    }));

    const newText = writeView.querySelector("[data-daily-newtext]");
    if (newText){
      newText.addEventListener("keydown", ev => {
        if (ev.key !== "Enter" || !newText.value.trim()) return;
        const hoursEl = writeView.querySelector("[data-daily-newhours]");
        addDaily(writeView.querySelector("[data-daily-newdate]").value, newText.value, hoursEl.value);
        renderWrite();
        writeView.querySelector("[data-daily-newtext]")?.focus();
      });
    }
  }

  /** 기록 추가/삭제는 세 화면이 공유한다 — 시간은 비워도 되고, 빈 문자열로 저장한다(0h가 아니라 "안 적음"). */
  function addDaily(date, text, hours){
    if (!text.trim()) return null;
    const e = { id: nextId(), date, text: text.trim(), hours: hours === "" || hours == null ? "" : Number(hours) };
    DAILY.push(e);
    return e;
  }
  function removeDaily(id){
    const entry = dailyEntry(id);
    if (!entry) return;
    const idx = DAILY.indexOf(entry);
    if (idx > -1) DAILY.splice(idx, 1);
  }

  function wireRowOnce(rowEl, wk){
    rowEl.querySelectorAll("[data-toggle]").forEach(btn => btn.addEventListener("click", () => {
      const panel = document.getElementById(btn.dataset.toggle);
      panel.classList.toggle("open"); btn.classList.toggle("open");
    }));
    rowEl.querySelectorAll("[data-field]").forEach(el => el.addEventListener("input", () => {
      const id = Number(rowEl.dataset.id);
      const val = el.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value;
      applyFieldToState(wk, id, el.dataset.field, val);
      if (el.dataset.field === "completion") toggleDoneBadge(rowEl, val);
    }));
    rowEl.querySelectorAll("[data-remove]").forEach(btn => btn.addEventListener("click", () => {
      removeFromState(wk, Number(rowEl.dataset.id));
      rowEl.remove();
    }));
    wireVacationToggle(rowEl, wk);
  }

  /** 휴가 행의 "하루로"/"기간으로" 토글 — 레이아웃이 바뀌므로 행 전체를 다시 그려서 교체한다. */
  function wireVacationToggle(rowEl, wk){
    rowEl.querySelector("[data-toggle-period]")?.addEventListener("click", () => {
      const item = wk.vacation.find(i => i.id === Number(rowEl.dataset.id));
      if (!item) return;
      item.period = !item.period;
      if (!item.period) item.endDate = "";
      const tmp = document.createElement("div");
      tmp.innerHTML = simpleRow(item, "vacation");
      const replacement = tmp.firstElementChild;
      rowEl.replaceWith(replacement);
      wireRowOnce(replacement, wk);
    });
  }

  /** 프로젝트 세부 항목 행 하나(신규 추가분)에 이벤트를 붙인다. */
  function wireSubitemRowOnce(rowEl, wk){
    rowEl.querySelectorAll("[data-toggle]").forEach(btn => btn.addEventListener("click", () => {
      const panel = document.getElementById(btn.dataset.toggle);
      panel.classList.toggle("open"); btn.classList.toggle("open");
    }));
    rowEl.querySelectorAll("[data-field]").forEach(el => el.addEventListener("input", () => {
      const item = findSubitem(wk, Number(rowEl.dataset.projectId), Number(rowEl.dataset.itemId));
      if (!item) return;
      const val = el.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value;
      item[el.dataset.field] = val;
      if (el.dataset.field === "completion") toggleDoneBadge(rowEl, val);
    }));
    rowEl.querySelector("[data-remove-subitem]")?.addEventListener("click", () => {
      const proj = wk.projects.find(p => p.id === Number(rowEl.dataset.projectId));
      if (proj) proj.subitems = proj.subitems.filter(i => i.id !== Number(rowEl.dataset.itemId));
      rowEl.remove();
    });
  }

  function toggleDoneBadge(row, completionVal){
    const done = Number(completionVal) === 100;
    let badge = row.querySelector(".badge.done");
    if (done && !badge){
      row.querySelector(".row-main").insertBefore(
        Object.assign(document.createElement("span"), { className: "badge done", textContent: "완료" }),
        row.querySelector("[data-toggle]")
      );
    }
    if (!done && badge) badge.remove();
  }

  function findItemContainer(wk, id){
    for (const g of ["dev","etc","vacation"]) if (wk[g] && wk[g].some(i => i.id === id)) return wk[g];
    return null;
  }
  function applyFieldToState(wk, id, field, val){
    const arr = findItemContainer(wk, id);
    const item = arr && arr.find(i => i.id === id);
    if (item) item[field] = val;
  }
  function removeFromState(wk, id){
    const arr = findItemContainer(wk, id);
    if (!arr) return;
    const idx = arr.findIndex(i => i.id === id);
    if (idx > -1) arr.splice(idx, 1);
  }
  function findSubitem(wk, projectId, itemId){
    const proj = (wk.projects || []).find(p => p.id === projectId);
    return proj ? (proj.subitems.find(i => i.id === itemId) || null) : null;
  }

  // ---------- markdown preview / export ----------
  function buildMarkdown(wk){
    const lines = [];
    lines.push(`# 정준호 · ${wk.label}`);
    lines.push("");
    lines.push(`파트원 · ${wk.range}`);
    lines.push("");

    const fmtItem = (i) => {
      let s = "- ";
      if (i.ticket) s += `${i.ticket} : `;
      s += i.title || "(제목 없음)";
      if (i.phase) s += ` [${i.phase === "분석/설계" ? "설계" : i.phase}]`;
      const parts = [];
      if (i.hours !== "" && i.hours != null) parts.push(`${i.hours}h`);
      parts.push(`${i.completion === "" || i.completion == null ? 0 : i.completion}%`);
      s += " — " + parts.join(" · ");
      if (i.carriedOver) s += " (이월)";
      return s;
    };

    const scheduleLines = (i) => {
      const out = [];
      if (i.devDoneDate) out.push(`  - 개발완료일: ${i.devDoneDate}`);
      if (i.testDate) out.push(`  - 테스트예정일: ${i.testDate}`);
      if (i.deployDate) out.push(`  - 배포예정일: ${i.deployDate}`);
      if (i.note) out.push(`  - 비고: ${i.note}`);
      return out;
    };

    // 프로젝트의 세부 항목은 손댄 흔적(시간 또는 진행률)이 있을 때만 한 줄로 내보낸다.
    // 같은 프로젝트에 항목이 여러 개면(예: 개발 항목 2개) 항목 수만큼 줄이 나뉜다 (스키마상 항목 1개 = 줄 1개).
    const subitemTouched = (i) => (i.hours !== "" && i.hours != null) || (i.completion !== "" && i.completion != null);

    if (wk.projects && wk.projects.some(p => (p.subitems||[]).some(subitemTouched))){
      lines.push("## 프로젝트", "");
      wk.projects.forEach(p => {
        const touched = (p.subitems||[]).filter(subitemTouched);
        if (!touched.length) return;
        lines.push(`### ${p.name}`, "");
        touched.forEach(i => {
          lines.push(fmtItem({ ...i, ticket: p.ticket, title: i.title || p.name }));
          lines.push(...scheduleLines(i));
        });
        lines.push("");
      });
    }
    if (wk.dev && wk.dev.length){
      lines.push("## 개발", "");
      wk.dev.forEach(i => { lines.push(fmtItem(i)); lines.push(...scheduleLines(i)); });
      lines.push("");
    }
    if (wk.etc && wk.etc.length){
      lines.push("## 기타", "");
      wk.etc.forEach(i => lines.push(`- ${i.title || "(제목 없음)"}${i.hours !== "" && i.hours != null ? " — " + i.hours + "h" : ""}`));
      lines.push("");
    }
    if (wk.vacation && wk.vacation.length){
      lines.push("## 휴가", "");
      wk.vacation.forEach(i => {
        const dateLabel = i.period && i.endDate ? `${i.date || "(날짜 없음)"} ~ ${i.endDate}` : (i.date || "(날짜 없음)");
        lines.push(`- ${dateLabel}${i.hours !== "" && i.hours != null ? " — " + i.hours + "h" : ""}`);
      });
      lines.push("");
    }

    const t = computeTotals(wk);
    lines.push("---", "");
    lines.push(`**합계: ${t.totalHours}h / ${t.manWeek} 맨위크**`);
    return { text: lines.join("\n"), ...t };
  }

  let pendingWeek = null;
  function openPreview(wk){
    pendingWeek = wk;
    const { text } = buildMarkdown(wk);
    $("#modalTitle").textContent = "제출 전 미리보기";
    $("#modalPre").textContent = text;
    $("#modalConfirm").textContent = "md로 내보내기";
    $("#modalBackdrop").classList.add("open");
  }
  $("#modalClose").addEventListener("click", () => $("#modalBackdrop").classList.remove("open"));
  $("#modalEdit").addEventListener("click", () => $("#modalBackdrop").classList.remove("open"));
  $("#modalBackdrop").addEventListener("click", (e) => { if (e.target.id === "modalBackdrop") $("#modalBackdrop").classList.remove("open"); });
  $("#modalConfirm").addEventListener("click", () => {
    const { text } = buildMarkdown(pendingWeek);
    const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `주간보고_정준호_${pendingWeek.label.replace(" ", "")}.md`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    pendingWeek.status = "submitted";
    $("#modalBackdrop").classList.remove("open");
    renderWrite();
    showToast("md 파일을 내보냈어요");
  });

  // ---------- 과거 보고서 카드 (대시보드 / 히스토리 공용) ----------
  /**
   * 과거 보고서 = 이번 주를 뺀 "제출된" 주만. 최신순.
   * 작성중(draft) 초안도 넣는 안을 검토했으나 사용자 결정으로 제외 — 목록은 제출본 아카이브다.
   * (초안은 대시보드의 "이번 주" 카드나 작성 탭 주차 페이저로 접근한다.)
   */
  function pastReports(){
    return WEEKS.map((w, idx) => ({ w, idx }))
      .filter(x => x.idx !== CURRENT_IDX && x.w.status === "submitted")
      .reverse();
  }

  /** 이번 주 카드(hero) 전용 — 목록은 전부 제출본이라 배지를 달지 않는다. */
  function statusBadge(status){
    if (status === "submitted") return '<span class="badge done">제출됨</span>';
    if (status === "draft") return '<span class="badge draft">작성중</span>';
    return '<span class="badge idle">미작성</span>';
  }

  /** 클릭하면 "작성" 탭의 그 주로 이동한다 — 이 앱엔 읽기전용 상세 화면이 없다(지난 주도 항상 수정 가능). */
  function histCardHtml(w, idx){
    const t = computeTotals(w);
    return `
      <div class="hist-card" data-idx="${idx}">
        <div class="hist-summary">
          ${t.low ? '<div class="low-stripe"></div>' : ""}
          <div class="hist-left">
            <div class="wk">${esc(w.label)} ${t.low ? '<span class="badge carry">맨위크 낮음</span>' : ""}</div>
            <div class="rng">${esc(w.range)}</div>
          </div>
          <div class="hist-right">
            <div class="hist-metric"><div class="n tabular">${t.totalHours}h</div><div class="l">총 시간</div></div>
            <div class="hist-metric ${t.low ? "low" : ""}"><div class="n tabular">${t.manWeek}</div><div class="l">맨위크</div></div>
            <span class="chev">${ICON_CHEV}</span>
          </div>
        </div>
      </div>`;
  }

  function wireHistCards(container){
    container.querySelectorAll(".hist-card").forEach(el => {
      el.addEventListener("click", () => {
        weekIdx = Number(el.dataset.idx);
        switchTab("write");
      });
    });
  }

  // ---------- history (과거 보고서 / 한 일 기록) ----------
  /**
   * 히스토리 탭은 v4에서 두 뷰를 담는다.
   *
   * 왜 4번째 탭을 만들지 않았나 (IA 판단):
   *  1) 한국어로 '히스토리'와 '기록'은 헤더에 나란히 서면 구분이 안 된다 — 이름부터 충돌한다.
   *  2) 두 목록의 성격이 같다: 지난 것을 최신순으로 훑고, 클릭하면 그 시점으로 들어간다.
   *  3) 기록을 **적는** 자리는 이미 둘(대시보드 캡처 카드 / 작성 화면 패널)이다.
   *     이 화면은 적는 곳이 아니라 **찾아보는** 곳이라 매일 들르는 동선이 아니다 → 탭 승격 근거가 약하다.
   *  4) 히스토리 탭은 그동안 카드 목록 하나뿐인 가장 빈 탭이었다 — 이 뷰가 그 자리를 채운다.
   *
   * 왜 월 축인가: 주 축은 이미 작성 화면 패널이 하고 있어서 그대로 옮기면 "쭉 보기"가 안 된다.
   * 한 달치를 한 화면에 세로로 쭉 깔고, 넘기는 조작은 한 달에 한 번만 일어나게 한다(주 페이저 대비 1/4).
   */
  let histSub = "reports";                    // "reports" | "records"
  let recMonth = DEMO_TODAY.slice(0, 7);      // 한 일 기록 화면이 보고 있는 달
  let recQuery = "";                          // 검색어 — 비어있지 않으면 월 범위를 무시하고 전체 기간에서 찾는다

  function monthLabel(ym){ const [y, m] = ym.split("-"); return `${y}년 ${Number(m)}월`; }
  function shiftMonth(ym, n){
    const [y, m] = ym.split("-").map(Number);
    const d = new Date(y, m - 1 + n, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  }
  function monthBounds(){
    const months = DAILY.map(e => e.date.slice(0, 7)).concat(DEMO_TODAY.slice(0, 7)).sort();
    return { min: months[0], max: months[months.length - 1] };
  }
  function longDayLabel(iso){
    const d = new Date(iso + "T00:00:00");
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} (${DOW[d.getDay()]})`;
  }

  function renderHistory(){
    const past = pastReports();
    historyView.innerHTML = `
      <div class="hist-switch">
        <div class="seg" role="tablist">
          <button class="${histSub === "reports" ? "active" : ""}" data-hist-sub="reports">과거 보고서 · ${past.length}</button>
          <button class="${histSub === "records" ? "active" : ""}" data-hist-sub="records">한 일 기록 · ${DAILY.length}</button>
        </div>
      </div>
      ${histSub === "reports" ? reportsPaneHtml(past) : recordsPaneHtml()}`;

    historyView.querySelectorAll("[data-hist-sub]").forEach(btn => btn.addEventListener("click", () => {
      histSub = btn.dataset.histSub;
      renderHistory();
      window.scrollTo({ top: 0 });
    }));

    if (histSub === "reports"){ wireHistCards($("#historyList")); return; }
    wireRecordsEvents();
  }

  function reportsPaneHtml(past){
    return `<div id="historyList" class="dash-list">${
      past.length ? past.map(({ w, idx }) => histCardHtml(w, idx)).join("")
                  : `<p class="empty-hint">아직 제출된 보고서가 없습니다.</p>`}</div>`;
  }

  /**
   * 한 일 기록 — 열람/수정 전용. v3에서 확정한 "체크·승격 없음" 원칙이 이 화면에도 그대로 적용된다:
   * 여기서 기록을 골라 주간보고 항목으로 만드는 장치는 없다(추가/수정/삭제 셋뿐, 좌측 패널과 동일).
   * 날짜 정렬은 **최신 위**(과거 보고서 목록과 같은 최신순) — 작성 화면 패널이 금→목 오름차순인 것과 다르다.
   * 패널은 한 주를 처음부터 끝까지 읽는 자리고, 여기는 최근에서 거슬러 올라가는 자리라 기준 축이 다르다.
   */
  function recordsPaneHtml(){
    const searching = recQuery.trim() !== "";
    const q = recQuery.trim().toLowerCase();
    const list = searching
      ? DAILY.filter(e => e.text.toLowerCase().includes(q))
      : DAILY.filter(e => e.date.startsWith(recMonth));
    const days = [...new Set(list.map(e => e.date))].sort().reverse();
    const bounds = monthBounds();
    const totalHours = sumHours(list);

    const groups = days.map(d => dayGroupHtml(
      d,
      list.filter(e => e.date === d).sort((a, b) => a.id - b.id),
      "",
      searching ? longDayLabel : dayLabel
    )).join("");

    const defaultDate = recMonth === DEMO_TODAY.slice(0, 7) ? DEMO_TODAY : recMonth + "-01";

    return `
      <div class="rec-toolbar">
        <div class="pager inline">
          <button data-rec-prev aria-label="이전 달" title="이전 달" ${!searching && recMonth <= bounds.min ? "disabled" : ""}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="label">${monthLabel(recMonth)}</div>
          <button data-rec-next aria-label="다음 달" title="다음 달" ${!searching && recMonth >= bounds.max ? "disabled" : ""}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="rec-search">
          ${ICON_SEARCH}
          <input type="text" value="${esc(recQuery)}" placeholder="기록 검색 (예: GTPP)" data-rec-search autocomplete="off">
          ${searching ? `<button class="icon-btn chevron clear" data-rec-clear title="검색 지우기">${ICON_X}</button>` : ""}
        </div>
      </div>

      ${searching ? `<div class="rec-scope">${ICON_SEARCH} 전체 기간에서 “${esc(recQuery.trim())}” — ${list.length}건</div>` : `
      <div class="stats">
        <div class="stat"><span class="k">기록</span><span class="v tabular">${list.length}<small>건</small></span></div>
        <div class="stat"><span class="k">기록된 시간</span><span class="v tabular">${fmtHours(totalHours)}<small>h</small></span></div>
        <div class="stat"><span class="k">기록한 날</span><span class="v tabular">${days.length}<small>일</small></span></div>
      </div>`}

      <div class="card rec-list">
        ${searching ? "" : `
        <div class="quick-add" style="margin-top:0;">
          <input class="date-sel" type="date" value="${defaultDate}" data-rec-newdate title="기록할 날짜">
          <input class="qa-hours tabular" type="number" step="0.5" min="0" placeholder="시간" title="투입시간 (선택)" data-rec-newhours>
          <input type="text" placeholder="한 일 추가 (Enter)" data-rec-newtext autocomplete="off">
        </div>`}
        ${groups || `<p class="empty-hint" style="padding:26px 0; text-align:center;">${
          searching ? "검색 결과가 없습니다." : "이 달에 기록된 일이 없습니다."}</p>`}
      </div>

      <p class="daily-note">주간보고를 쓸 때 참고하는 개인 기록입니다. 내보내는 <b>.md</b> 파일에는 포함되지 않습니다.</p>`;
  }

  function wireRecordsEvents(){
    const bounds = monthBounds();
    $("[data-rec-prev]")?.addEventListener("click", () => {
      if (recMonth <= bounds.min) return;
      recMonth = shiftMonth(recMonth, -1); recQuery = ""; renderHistory();
    });
    $("[data-rec-next]")?.addEventListener("click", () => {
      if (recMonth >= bounds.max) return;
      recMonth = shiftMonth(recMonth, 1); recQuery = ""; renderHistory();
    });

    const search = $("[data-rec-search]");
    if (search){
      // 목업이라 즉시 필터. 실제 앱에선 hx-trigger="keyup changed delay:300ms"로 목록 영역만 교체한다.
      search.addEventListener("input", () => {
        const pos = search.selectionStart;
        recQuery = search.value;
        renderHistory();
        const again = $("[data-rec-search]");
        again.focus(); again.setSelectionRange(pos, pos);
      });
    }
    $("[data-rec-clear]")?.addEventListener("click", () => { recQuery = ""; renderHistory(); });

    wireDailyFields(historyView, refreshDaySum);
    historyView.querySelectorAll("[data-daily-remove]").forEach(btn => btn.addEventListener("click", () => {
      removeDaily(Number(btn.closest("[data-daily]").dataset.daily));
      renderHistory();
    }));

    const newText = $("[data-rec-newtext]");
    newText?.addEventListener("keydown", ev => {
      if (ev.key !== "Enter") return;
      const date = $("[data-rec-newdate]").value;
      if (!addDaily(date, newText.value, $("[data-rec-newhours]").value)) return;
      // 보고 있는 달 밖의 날짜로 적으면 그 달로 따라간다 — 적었는데 화면에서 사라지는 일이 없어야 한다
      if (!date.startsWith(recMonth)) recMonth = date.slice(0, 7);
      renderHistory();
      $("[data-rec-newtext]")?.focus();
    });
  }

  // ---------- dashboard ----------
  const RECENT_WEEKS_FOR_AVG = 2;   // "최근 2주 평균 맨위크" — 기존 4주 평균에서 사용자 요청으로 변경
  const RECENT_REPORTS_ON_DASH = 5; // 대시보드에 노출할 과거 보고서 개수(전체는 히스토리 탭)
  const PROJECT_LOOKBACK = 4;       // 진행중 프로젝트를 찾을 때 거슬러 볼 보고서 수

  /** 프로젝트 진행률 = 세부 항목 완료율의 평균(반올림). 100%면 더는 "진행중"이 아니다. */
  function projectProgress(p){
    const filled = (p.subitems || []).filter(i => i.completion !== "" && i.completion != null);
    if (!filled.length) return 0;
    return Math.round(filled.reduce((n, i) => n + Number(i.completion || 0), 0) / filled.length);
  }

  /**
   * 진행중 프로젝트 — 최근 보고서들을 최신순으로 훑어 일감번호 기준으로 중복을 제거하고,
   * 가장 최근 진행률이 100% 미만인 것만 남긴다.
   * (실제 앱에서는 Project.active == true가 1차 필터가 된다 — design_summary.md 참고)
   */
  function activeProjects(){
    const cur = WEEKS[CURRENT_IDX];
    const scope = (cur.status === "empty" ? [] : [{ w: cur, idx: CURRENT_IDX }])
      .concat(pastReports()).slice(0, PROJECT_LOOKBACK);
    const seen = new Set();
    const out = [];
    scope.forEach(({ w, idx }) => (w.projects || []).forEach(p => {
      const key = p.ticket || p.name;
      if (seen.has(key)) return;
      seen.add(key);
      const pct = projectProgress(p);
      if (pct >= 100) return;
      out.push({ name: p.name, ticket: p.ticket, pct, lastWeek: w.label, idx });
    }));
    return out;
  }

  function dailyCaptureCardHtml(){
    const cur = WEEKS[CURRENT_IDX];
    const days = weekDays(cur);
    const all = dailyOf(cur);
    const today = all.filter(e => e.date === DEMO_TODAY);
    // 오늘 말고도 최근 며칠은 펼쳐둔다 — 어제 적은 걸 오늘 고치는 일이 잦다. 그 주 전체는 작성 화면 패널에서 본다.
    const prevDays = days.filter(d => d < DEMO_TODAY && all.some(e => e.date === d)).reverse().slice(0, DASH_RECENT_DAYS - 1);
    const todayHours = hoursTag(today);
    const weekHours = hoursTag(all);

    return `
      <div class="card tile dash-daily t-daily">
        <div class="daily-head">
          <div class="card-title"><h2>오늘 한 일</h2><span class="count">${today.length}건${todayHours ? " · " + todayHours : ""}</span></div>
          <span class="kicker">${dayLabel(DEMO_TODAY)}</span>
        </div>
        <!-- 시간 칸은 비워도 되는 보조 칸이라 텍스트 뒤에 붙이고 폭을 고정한다 — 캡처의 주인공은 여전히 텍스트다 -->
        <div class="quick-add">
          <input id="quickAddInput" type="text" placeholder="방금 끝낸 일을 짧게 적어두세요 (Enter)" autocomplete="off">
          <input id="quickAddHours" class="qa-hours tabular" type="number" step="0.5" min="0" placeholder="시간" title="투입시간 (선택)">
          <button class="ghost" id="quickAddBtn">${ICON_PLUS} 추가</button>
        </div>
        <div class="tile-body">
          ${today.map(dailyRowHtml).join("") || `<p class="empty-hint">오늘은 아직 기록이 없습니다.</p>`}
          ${prevDays.map(d => dayGroupHtml(d, all.filter(e => e.date === d))).join("")}
        </div>
        <div class="daily-foot">
          <span>이번 주 기록 <b>${all.length}</b>건${weekHours ? ` · <b class="tabular">${weekHours}</b>` : ""}</span>
          <span class="foot-links">
            <button class="link-more" id="toRecordsBtn">전체 기록 보기</button>
            <button class="link-more" id="toWriteFromDailyBtn">주간보고 쓰면서 보기 ${ICON_ARROW}</button>
          </span>
        </div>
      </div>`;
  }

  // ---------- 할 일(전망형 개인 목록) ----------
  /**
   * 할 일 = { id, due, text, done, priority } — 이게 전부다(2026-08-15 사용자 확정 스코프).
   * 예상소요시간·반복일정 없음. 자동 이월 없음(못 지킨 일은 원래 날짜에 그대로 두고 표시만 강조).
   * 완료해도 일일 기록(DAILY)으로 넘어가지 않고, .md 내보내기에도 포함되지 않는다 — 두 목록은 완전히 별개다.
   * ReportItem의 개발완료일/테스트예정일/배포예정일과도 무관하다(FK 없음).
   */
  // 접힌 상태에서 보여줄 미완료 항목 수(그 이상은 "+N건 더").
  // v6은 6이었다 — 벤토에서 TODO가 세로로 가장 긴 타일(4×10 = 746px)이 되면서 6건만 그리면
  // 목록 아래가 200px 가까이 비어 "내용이 모자란 큰 카드"로 보인다. 타일 높이에 맞춰 8로 올린다.
  const TODO_VISIBLE = 8;
  const PRIO = { high:{label:"높음"}, mid:{label:"보통"}, low:{label:"낮음"} };
  const PRIO_ORDER = ["high","mid","low"];
  const nextPrio = p => PRIO_ORDER[(PRIO_ORDER.indexOf(p) + 1) % PRIO_ORDER.length];

  let todoExpanded = false;   // "+N건 더" 펼침 상태 (렌더 사이에 유지)
  let todoDoneOpen = false;   // 완료 목록 펼침 상태
  let todoNewPrio = "mid";    // 추가 입력줄의 우선순위

  const TODOS = [
    { id: nextId(), due:"2026-08-10", text:"GTPP 결제 타임아웃 재현 케이스 정리", done:false, priority:"high" },
    { id: nextId(), due:"2026-08-12", text:"2차인증 API 스펙 회신", done:false, priority:"mid" },
    { id: nextId(), due:"2026-08-13", text:"결제 배치 재처리 결과 확인", done:false, priority:"high" },
    { id: nextId(), due:"2026-08-13", text:"주간보고 초안 정리", done:false, priority:"mid" },
    { id: nextId(), due:"2026-08-14", text:"OTP 발송 모듈 코드리뷰 반영", done:false, priority:"mid" },
    { id: nextId(), due:"2026-08-17", text:"신입 온보딩 교육자료 초안", done:false, priority:"low" },
    { id: nextId(), due:"2026-08-18", text:"GTPP 릴리스 노트 정리", done:false, priority:"mid" },
    { id: nextId(), due:"2026-08-19", text:"결제 모듈 성능 측정 스크립트 작성", done:false, priority:"low" },
    { id: nextId(), due:"2026-08-20", text:"2차인증 QA 시나리오 검토", done:false, priority:"mid" },
    { id: nextId(), due:"2026-08-21", text:"파트 기술공유 발표 자료", done:false, priority:"low" },
    { id: nextId(), due:"2026-08-11", text:"배포 스크립트 백업", done:true,  priority:"mid" },
    { id: nextId(), due:"2026-08-12", text:"파트 주간회의 안건 정리", done:true, priority:"mid" },
  ];

  function todoOf(id){ return TODOS.find(t => t.id === id) || null; }
  function shortDate(iso){ return iso.slice(5).replace("-", "."); }

  /** 미완료 정렬: 기한 이른 순 → 우선순위(높음·보통·낮음) → 등록순. 기한 지난 것이 자연히 맨 위로 온다. */
  function openTodos(){
    return TODOS.filter(t => !t.done).sort((a, b) =>
      a.due < b.due ? -1 : a.due > b.due ? 1
      : PRIO_ORDER.indexOf(a.priority) - PRIO_ORDER.indexOf(b.priority) || a.id - b.id);
  }
  function doneTodos(){ return TODOS.filter(t => t.done).sort((a, b) => a.due < b.due ? 1 : a.due > b.due ? -1 : b.id - a.id); }

  function todoRowHtml(t){
    const p = PRIO[t.priority] || PRIO.mid;
    const over = !t.done && t.due < DEMO_TODAY;
    return `
      <div class="todo-row ${t.done ? "done" : ""}" data-todo="${t.id}">
        <div class="todo-item">
          <input class="todo-check" type="checkbox" ${t.done ? "checked" : ""} data-todo-done aria-label="완료 표시">
          <div class="t-wrap">
            ${over ? `<span class="od" title="기한 ${shortDate(t.due)} 지남">${shortDate(t.due)}</span>` : ""}
            <textarea class="t-txt" rows="1" placeholder="할 일" data-todo-text>${esc(t.text)}</textarea>
          </div>
          <button class="prio ${t.priority}" data-todo-prio title="우선순위 ${p.label} · 클릭해 변경">${p.label}</button>
          <button class="icon-btn chevron" data-todo-cal title="기한 변경">${ICON_CAL}</button>
          <button class="icon-btn" data-todo-remove title="할 일 삭제">${ICON_TRASH}</button>
        </div>
        <div class="row-detail" data-todo-detail>
          <label class="inline">기한<input type="date" value="${t.due}" data-todo-due></label>
        </div>
      </div>`;
  }

  function todoCardHtml(){
    const open = openTodos();
    const done = doneTodos();
    const shown = todoExpanded ? open : open.slice(0, TODO_VISIBLE);
    const hidden = open.length - shown.length;

    // 기한 지난 것들은 날짜가 제각각이라 한 그룹으로 묶고(행마다 날짜 칩), 나머지는 날짜별 그룹.
    const overdue = shown.filter(t => t.due < DEMO_TODAY);
    const rest = shown.filter(t => t.due >= DEMO_TODAY);
    const dates = [...new Set(rest.map(t => t.due))];

    let groups = "";
    if (overdue.length){
      groups += `
        <div class="day-group">
          <div class="day-head over"><span>기한 지남</span><span class="n">${overdue.length}건</span></div>
          ${overdue.map(todoRowHtml).join("")}
        </div>`;
    }
    groups += dates.map(d => `
      <div class="day-group">
        <div class="day-head">
          <span>${dayLabel(d)}</span>
          ${d === DEMO_TODAY ? '<span class="today-chip">오늘</span>' : ""}
        </div>
        ${rest.filter(t => t.due === d).map(todoRowHtml).join("")}
      </div>`).join("");

    // 전체 열람 화면이 없으므로 "더 보기"는 다른 데로 보내지 않고 이 카드 안에서만 펼친다.
    const moreBtn = hidden > 0
      ? `<div class="todo-foot"><button class="link-more" data-todo-more>+${hidden}건 더 보기 ${ICON_ARROW}</button></div>`
      : (todoExpanded && open.length > TODO_VISIBLE
        ? `<div class="todo-foot"><button class="link-more" data-todo-more>접기</button></div>` : "");

    // 완료한 것은 지우지 않는다(잘못 체크한 걸 되돌릴 수 있어야 하므로) — 대신 접어서 남은 일이 목록의 주인공이 되게 한다.
    const doneBlock = done.length ? `
      <div class="todo-done">
        <button class="link-more" data-todo-donetoggle>${todoDoneOpen ? "완료 숨기기" : `완료 ${done.length}건 보기`}</button>
        ${todoDoneOpen ? done.map(todoRowHtml).join("") : ""}
      </div>` : "";

    const np = PRIO[todoNewPrio];
    return `
      <div class="card tile todo-card t-todo">
        <div class="card-head">
          <div class="card-title"><h2>TODO 리스트</h2><span class="count" title="미완료">${open.length}건</span></div>
        </div>
        <div class="quick-add">
          <input class="date-sel" type="date" value="${DEMO_TODAY}" data-todo-newdue title="기한">
          <button class="prio ${todoNewPrio}" data-todo-newprio title="우선순위 ${np.label} · 클릭해 변경">${np.label}</button>
          <input type="text" data-todo-newtext placeholder="할 일 추가 (Enter)" autocomplete="off">
        </div>
        <div class="tile-body">
          ${groups || `<p class="empty-hint" style="padding:14px 0;">등록된 할 일이 없습니다.</p>`}
          ${moreBtn}
          ${doneBlock}
        </div>
        <p class="todo-note">개인용 목록입니다. 주간보고(.md)에는 나가지 않습니다.</p>
      </div>`;
  }

  function wireTodoEvents(){
    const scope = dashboardView;
    const rowId = el => Number(el.closest("[data-todo]").dataset.todo);

    // 텍스트만 화면을 다시 그리지 않는다(입력 포커스 유지) — 나머지는 목록 순서/그룹이 바뀌므로 재렌더
    scope.querySelectorAll("[data-todo-text]").forEach(el => {
      autoGrow(el);
      el.addEventListener("input", () => {
        autoGrow(el);
        const t = todoOf(rowId(el));
        if (t) t.text = el.value;
      });
      el.addEventListener("keydown", ev => { if (ev.key === "Enter"){ ev.preventDefault(); el.blur(); } });
    });
    scope.querySelectorAll("[data-todo-done]").forEach(el => el.addEventListener("change", () => {
      const t = todoOf(rowId(el));
      if (!t) return;
      // 체크하면 그 자리에서 사라지고 하단 "완료 N건" 섹션으로 내려간다(펼쳐둔 상태라면 거기서 바로 보인다)
      t.done = el.checked;
      renderDashboard();
    }));
    scope.querySelectorAll("[data-todo-prio]").forEach(el => el.addEventListener("click", () => {
      const t = todoOf(rowId(el));
      if (!t) return;
      t.priority = nextPrio(t.priority);
      renderDashboard();
    }));
    scope.querySelectorAll("[data-todo-cal]").forEach(el => el.addEventListener("click", () => {
      const panel = el.closest("[data-todo]").querySelector("[data-todo-detail]");
      panel.classList.toggle("open");
      el.classList.toggle("open");
      if (panel.classList.contains("open")) panel.querySelector("input")?.focus();
    }));
    scope.querySelectorAll("[data-todo-due]").forEach(el => el.addEventListener("change", () => {
      const t = todoOf(rowId(el));
      if (!t || !el.value) return;
      t.due = el.value;          // 기한을 옮겨도 이력은 남지 않는다 — 자동 이월이 없으니 옮기는 건 사람의 선택
      renderDashboard();
    }));
    scope.querySelectorAll("[data-todo-remove]").forEach(el => el.addEventListener("click", () => {
      const idx = TODOS.indexOf(todoOf(rowId(el)));
      if (idx > -1) TODOS.splice(idx, 1);
      renderDashboard();
    }));

    scope.querySelector("[data-todo-more]")?.addEventListener("click", () => { todoExpanded = !todoExpanded; renderDashboard(); });
    scope.querySelector("[data-todo-donetoggle]")?.addEventListener("click", () => { todoDoneOpen = !todoDoneOpen; renderDashboard(); });

    // 추가 입력줄의 우선순위는 재렌더 없이 제자리에서 바꾼다 — 타이핑 중인 텍스트가 날아가면 안 된다
    scope.querySelector("[data-todo-newprio]")?.addEventListener("click", ev => {
      todoNewPrio = nextPrio(todoNewPrio);
      const b = ev.currentTarget, p = PRIO[todoNewPrio];
      b.className = `prio ${todoNewPrio}`;
      b.textContent = p.label;
      b.title = `우선순위 ${p.label} · 클릭해 변경`;
    });
    const newText = scope.querySelector("[data-todo-newtext]");
    newText?.addEventListener("keydown", ev => {
      if (ev.key !== "Enter" || !newText.value.trim()) return;
      TODOS.push({ id: nextId(), due: scope.querySelector("[data-todo-newdue]").value || DEMO_TODAY,
                   text: newText.value.trim(), done:false, priority: todoNewPrio });
      renderDashboard();
      dashboardView.querySelector("[data-todo-newtext]")?.focus();
    });
  }

  /**
   * hero 타일(6×4) — 벤토에서 가장 큰 면적.
   * 담는 것: 이번 주가 몇 주차이고 어떤 상태인가 + 유일한 강한 CTA + 요일별 기록 스트립.
   * 숫자(시간/맨위크/건수)는 옆의 작은 지표 타일이 받는다 — 큰 타일과 작은 타일이 같은 숫자를
   * 두 번 말하지 않게 역할을 나눈 것이 v7 배치의 핵심이다.
   */
  const HERO_DAY_MAX_HOURS = 8;   // 요일 막대를 꽉 채우는 기준(하루 8시간)

  function heroTileHtml(){
    const cur = WEEKS[CURRENT_IDX];
    const all = dailyOf(cur);
    const days = weekDays(cur);
    const label = cur.status === "empty" ? "신규 작성" : cur.status === "draft" ? "이어서 작성" : "수정하기";
    const cls = cur.status === "submitted" ? "btn outline" : "btn";

    // 이 앱의 한 주는 금~목이라 7칸 전부를 그린다 — 주말이 비어 보이는 게 아니라, 주말이 주 안에 있다는 사실이 보여야 한다.
    const strip = days.map(d => {
      const h = sumHours(all.filter(e => e.date === d));
      const pct = h ? Math.max(8, Math.min(100, Math.round(h / HERO_DAY_MAX_HOURS * 100))) : 0;
      const dow = DOW[new Date(d + "T00:00:00").getDay()];
      const cl = [h ? "" : "empty", d === DEMO_TODAY ? "today" : ""].filter(Boolean).join(" ");
      return `
        <div class="wk-day ${cl}" title="${dayLabel(d)}${h ? ` · ${fmtHours(h)}h 기록` : " · 기록 없음"}">
          <span class="dw">${dow}</span>
          <span class="bar-v">${pct ? `<i style="height:${pct}%"></i>` : ""}</span>
          <span class="hh">${h ? fmtHours(h) : "·"}</span>
        </div>`;
    }).join("");

    const loggedDays = days.filter(d => all.some(e => e.date === d)).length;
    const wh = hoursTag(all);
    const sub = cur.status === "empty"
      ? `<p class="hero-note">아직 작성을 시작하지 않았습니다. 지난주 미완료 항목은 자동으로 이월되어 채워집니다.</p>`
      : `<span class="hero-sub">이번 주 기록 ${loggedDays}일${wh ? ` · ${wh}` : ""}</span>`;

    return `
      <div class="card tile hero t-hero">
        <div class="hero-top">
          <div class="hero-left">
            <span class="kicker">이번 주</span>
            <div class="hero-title">
              <span class="wk">${esc(cur.label)}</span>
              ${statusBadge(cur.status)}
            </div>
            <span class="rng">${esc(cur.range)}</span>
            ${sub}
          </div>
          <button class="${cls}" id="heroActionBtn">${label}</button>
        </div>
        <div class="wk-days">${strip}</div>
      </div>`;
  }

  /** 작은 지표 타일(3×2) — 좁은 면적에 40px 숫자 하나. 큰 타일 옆에서 "압축 요약"을 맡는다. */
  function metricTileHtml({ k, v, unit, sub, low }){
    return `
      <div class="card tile metric t-metric ${low ? "low" : ""}">
        <span class="kicker">${k}</span>
        <div class="v tabular">${v}${unit ? `<u>${unit}</u>` : ""}</div>
        <span class="s">${sub}</span>
      </div>`;
  }

  function renderDashboard(){
    const cur = WEEKS[CURRENT_IDX];
    const past = pastReports();
    const recent = past.slice(0, RECENT_WEEKS_FOR_AVG);

    // ① 주 단위로 훑는 추세 두 가지 — 최근 2주 평균 맨위크 / 진행중인 프로젝트(중간 크기 타일)
    const avg = recent.length
      ? recent.reduce((n, x) => n + Number(computeTotals(x.w).manWeek), 0) / recent.length
      : 0;
    const avgLow = avg < LOW_MANWEEK_THRESHOLD;
    const weekRows = recent.map(({ w }) => {
      const t = computeTotals(w);
      return `
        <div class="mw-week">
          <div class="top"><span class="lb">${esc(w.label)}</span><span class="vl tabular ${t.low ? "low" : ""}">${t.manWeek}</span></div>
          <div class="bar ${t.low ? "low" : ""}"><i style="width:${Math.min(100, Number(t.manWeek) * 100)}%"></i></div>
        </div>`;
    }).join("") || `<p class="empty-hint">평균을 낼 보고서가 아직 없습니다.</p>`;

    const projects = activeProjects();
    const projectRows = projects.length
      ? projects.map(p => `
        <div class="proj-row">
          <div class="proj-top">
            <span class="nm">${esc(p.name)}</span>
            ${p.ticket ? `<span class="tk">${esc(p.ticket)}</span>` : ""}
            <span class="pc tabular">${p.pct}%</span>
          </div>
          <div class="bar"><i style="width:${p.pct}%"></i></div>
          <div class="proj-meta">최근 보고 · ${esc(p.lastWeek)}</div>
        </div>`).join("")
      : `<p class="empty-hint">진행중인 프로젝트가 없습니다.</p>`;

    // ② 작은 지표 타일 4개 — hero 옆 6칸을 2×2로 채운다.
    // 고른 기준: "지금 손을 대야 하나"를 한 숫자로 답할 수 있는 것만. 나머지는 아래 큰 타일이 설명한다.
    const t = cur.status === "empty" ? null : computeTotals(cur);
    const itemCount = (cur.projects || []).reduce((a, p) => a + (p.subitems || []).length, 0)
      + (cur.dev || []).length + (cur.etc || []).length + (cur.vacation || []).length;
    const openT = openTodos();
    const overdueT = openT.filter(x => x.due < DEMO_TODAY).length;
    const todayT = openT.filter(x => x.due === DEMO_TODAY).length;
    const projAvg = projects.length
      ? Math.round(projects.reduce((n, p) => n + p.pct, 0) / projects.length) : 0;

    const metrics = [
      metricTileHtml({ k:"이번 주 시간", v: t ? fmtHours(t.totalHours) : "—", unit: t ? "h" : "",
                       sub: t ? `보고 항목 ${itemCount}건` : "아직 작성 전" }),
      metricTileHtml({ k:"이번 주 맨위크", v: t ? t.manWeek : "—", low: !!(t && t.low),
                       sub: t ? (t.low ? `기준 1.00 · ${LOW_MANWEEK_THRESHOLD} 미만` : "기준 1.00") : "아직 작성 전" }),
      metricTileHtml({ k:"기한 지난 할 일", v: overdueT, unit:"건", low: overdueT > 0,
                       sub: todayT ? `오늘 마감 ${todayT}건` : "오늘 마감 없음" }),
      metricTileHtml({ k:"진행중 프로젝트", v: projects.length, unit:"개",
                       sub: projects.length ? `평균 진행률 ${projAvg}%` : "진행중 없음" }),
    ].join("");

    // ③ 모자이크 조립. **넣는 순서가 곧 배치**다(.bento 주석의 계산 참고) — 순서를 바꾸면 구도가 무너진다.
    // 큰 타일(오늘 한 일 / TODO)이 매일 손대는 것, 중간 타일(맨위크 / 진행중)이 주 단위로 훑는 것,
    // 작은 타일이 한 번 쳐다보고 마는 것. 크기 자체가 "얼마나 자주 쓰는가"를 말한다.
    const recent5 = past.slice(0, RECENT_REPORTS_ON_DASH);
    dashboardView.innerHTML = `
      <div class="dash-wrap">
        <div class="bento">
          ${heroTileHtml()}
          ${metrics}
          ${dailyCaptureCardHtml()}
          ${todoCardHtml()}
          <div class="card tile t-mw">
            <span class="kicker">최근 ${RECENT_WEEKS_FOR_AVG}주 평균 맨위크</span>
            <div class="mw-big tabular ${avgLow ? "low" : ""}">${avg.toFixed(2)}</div>
            <div class="mw-sub">기준 1.00 · ${LOW_MANWEEK_THRESHOLD} 미만이면 낮음으로 표시</div>
            <div class="tile-body"><div class="mw-weeks">${weekRows}</div></div>
          </div>
          <div class="card tile t-proj">
            <div class="card-head">
              <div class="card-title"><h2>진행중인 프로젝트</h2><span class="count">${projects.length}건</span></div>
            </div>
            <div class="tile-body">${projectRows}</div>
          </div>
        </div>
        <!-- 과거 보고서 = 모자이크를 받치는 가로로 긴 타일. 카드를 누르면 그 주의 작성(수정) 화면으로 간다. -->
        <div class="bento bento-foot">
          <div class="card tile t-hist">
            <div class="card-head">
              <div class="card-title"><h2>과거 보고서</h2><span class="count">${past.length}개</span></div>
              ${past.length > recent5.length ? `<button class="link-more" id="moreHistBtn">전체 보기 ${ICON_ARROW}</button>` : ""}
            </div>
            <div class="dash-list flush" id="dashHistList">
              ${recent5.length ? recent5.map(({ w, idx }) => histCardHtml(w, idx)).join("") : `<p class="empty-hint">아직 제출된 보고서가 없습니다.</p>`}
            </div>
          </div>
        </div>
      </div>`;
    wireHistCards($("#dashHistList"));
    wireDashDailyEvents();
    wireTodoEvents();
    $("#moreHistBtn")?.addEventListener("click", () => { histSub = "reports"; switchTab("history"); });
    $("#heroActionBtn").addEventListener("click", () => {
      weekIdx = CURRENT_IDX;
      // "신규 작성" = 이번 주 초안을 (이월 항목까지 채워서) 만들고 바로 작성 화면으로 — 빈 화면을 한 번 더 거치지 않는다
      if (WEEKS[CURRENT_IDX].status === "empty"){
        const draft = buildCarriedOverDraft(WEEKS[CURRENT_IDX - 1], cur);
        WEEKS[CURRENT_IDX] = draft;
        switchTab("write");
        showToast(draft.projects.length || draft.dev.length ? "보고서 초안을 만들었어요 (이월 항목 포함)" : "보고서 초안을 만들었어요");
        return;
      }
      switchTab("write");
    });
  }

  /** 카드 제목 칩(오늘 N건 · Xh)과 하단 요약(이번 주 N건 · Xh)만 갱신 — 목록을 다시 그리면 편집 중이던 칸이 날아간다. */
  function refreshDashDailyTotals(){
    const all = dailyOf(WEEKS[CURRENT_IDX]);
    const today = all.filter(e => e.date === DEMO_TODAY);
    const th = hoursTag(today), wh = hoursTag(all);
    const chip = dashboardView.querySelector(".dash-daily .count");
    if (chip) chip.textContent = `${today.length}건${th ? " · " + th : ""}`;
    const foot = dashboardView.querySelector(".dash-daily .daily-foot > span:first-child");
    if (foot) foot.innerHTML = `이번 주 기록 <b>${all.length}</b>건${wh ? ` · <b class="tabular">${wh}</b>` : ""}`;
  }

  function wireDashDailyEvents(){
    const input = $("#quickAddInput");
    const add = () => {
      if (!addDaily(DEMO_TODAY, input.value, $("#quickAddHours").value)) return;
      renderDashboard();
      $("#quickAddInput").focus();   // 연달아 여러 건 적는 흐름을 끊지 않는다
    };
    input?.addEventListener("keydown", ev => { if (ev.key === "Enter") add(); });
    // 시간 칸에서 Enter를 쳐도 같은 동작이어야 한다 — 텍스트→시간 순으로 Tab 하고 그대로 Enter 치는 흐름이 자연스럽다
    $("#quickAddHours")?.addEventListener("keydown", ev => { if (ev.key === "Enter") add(); });
    $("#quickAddBtn")?.addEventListener("click", add);

    // 대시보드의 '오늘' 기록들은 날짜 헤더 없이 바로 놓이므로, 합계는 카드 제목의 칩과 하단 요약이 대신 받는다
    wireDailyFields(dashboardView, el => { refreshDaySum(el); refreshDashDailyTotals(); });
    dashboardView.querySelectorAll("[data-daily-remove]").forEach(btn => btn.addEventListener("click", () => {
      removeDaily(Number(btn.closest("[data-daily]").dataset.daily));
      renderDashboard();
    }));

    $("#toWriteFromDailyBtn")?.addEventListener("click", () => { weekIdx = CURRENT_IDX; switchTab("write"); });
    $("#toRecordsBtn")?.addEventListener("click", () => { histSub = "records"; switchTab("history"); });
  }

  // ---------- tabs / week pager ----------
  const TABS = {
    dash:    ["#dashboardView", "#tabDashBtn",    renderDashboard],
    write:   ["#writeView",     "#tabWriteBtn",   renderWrite],
    history: ["#historyView",   "#tabHistoryBtn", renderHistory],
  };
  Object.entries(TABS).forEach(([key, [, btn]]) => $(btn).addEventListener("click", () => switchTab(key)));

  function switchTab(tab){
    Object.entries(TABS).forEach(([key, [view, btn]]) => {
      const on = key === tab;
      $(view).classList.toggle("active", on);
      $(btn).classList.toggle("active", on);
      $(btn).setAttribute("aria-selected", String(on));
    });
    // 주차 페이저는 "작성"에서만 의미가 있다
    $("#pager").style.visibility = tab === "write" ? "visible" : "hidden";
    if (tab !== "write") document.body.classList.remove("wide");
    TABS[tab][2]();
    window.scrollTo({ top: 0 });
  }

  $("#prevWeekBtn").addEventListener("click", () => { if (weekIdx > 0){ weekIdx--; renderWrite(); } });
  $("#nextWeekBtn").addEventListener("click", () => { if (weekIdx < WEEKS.length - 1){ weekIdx++; renderWrite(); } });

  let toastTimer = null;
  function showToast(msg){
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // 첫 진입은 대시보드.
  switchTab("dash");
})();
</script>
