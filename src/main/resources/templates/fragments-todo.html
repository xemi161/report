<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  TODO 리스트(전망형 개인 목록) — 지금은 대시보드 벤토의 우측 타일(4×6) 한 곳에서만 쓴다.
  그래서 일일 기록(fragments-daily)과 달리 화면을 고르는 view 파라미터가 없다.

  ⚠️ "오늘 한 일"(회고)과 정확히 반대 축의 목록이고 절대 섞이지 않는다 —
  완료해도 일일 기록으로 넘어가지 않고, .md 내보내기에도 나가지 않는다(카드 하단 문구가 상시 노출).
  그래서 이 파일 어디에도 "기록"이라는 단어를 쓰지 않는다("할 일"로 통일).

  htmx 배선 (기존 규약 그대로)
  - 구조가 바뀌는 동작(추가·삭제·완료 토글·우선순위 순환·기한 변경)은 목록의 정렬/그룹/건수가 전부
    달라지므로 카드를 통째로 다시 받아 hx-target="#todoCard" hx-swap="outerHTML"로 교체한다.
    backend의 라우트 5개가 모두 이 프래그먼트를 돌려주는 이유다.
  - 텍스트 인라인 수정만 hx-trigger="change" hx-swap="none"(POST /todos/{id}) — 다시 그리면 포커스가 날아간다.
  - 완료/우선순위는 값을 보내지 않는다. 서버가 현재 값을 반전/순환시킨다
    (체크 해제된 체크박스는 전송 자체가 안 되므로 클라이언트 값을 믿을 수 없다).
  - 행이 form이 아니다: 컨트롤마다 목적지가 달라서(텍스트/완료/우선순위/기한/삭제) 각 컨트롤이 자기 hx-post를
    갖는다. htmx는 요청을 일으킨 입력 자신의 값(name)을 실어 보내므로 text·dueDate는 그대로 전달된다.
  - week 파라미터가 없다. 할 일은 특정 주에 속하지 않는다(주를 넘겨봐도 같은 목록).

  접기/펼치기("+N건 더 보기", "완료 N건 보기")는 서버 왕복이 없다 —
  서버가 전부 내려주고 app.js가 #todoCard의 클래스(.expanded/.done-open)만 토글해 CSS로 감춘다.
-->

<!--
  할 일 한 줄.
  @param todo      TodoItem
  @param overdue   기한 지남 그룹의 행인가(그 그룹에서만 행마다 날짜 칩을 붙인다 — 날짜가 제각각이라)
  @param collapsed 접힘 상태에서 감출 행인가(전역 순번 >= todoVisibleLimit)
-->
<div th:fragment="todoRow(todo, overdue, collapsed)" class="todo-row"
     th:classappend="(${todo.done} ? 'done ' : '') + (${collapsed} ? 'over-limit' : '')">
    <div class="todo-item">
        <input class="todo-check" type="checkbox" th:checked="${todo.done}" aria-label="완료 표시"
               th:hx-post="@{'/todos/' + ${todo.id} + '/done'}"
               hx-trigger="change" hx-target="#todoCard" hx-swap="outerHTML"/>
        <div class="t-wrap">
            <span class="od" th:if="${overdue}" th:text="${todo.dueShortLabel()}"
                  th:title="'기한 ' + ${todo.dueShortLabel()} + ' 지남'">08.10</span>
            <!-- 좁은 카드라 문장이 잘리면 목록의 의미가 없다 — 기록(.d-txt)과 같은 줄바꿈 textarea.
                 높이 자동 확장과 Enter=편집 종료는 app.js가 .d-txt와 함께 처리한다. -->
            <textarea class="t-txt" name="text" rows="1" placeholder="할 일"
                      th:hx-post="@{'/todos/' + ${todo.id}}"
                      hx-trigger="change" hx-swap="none" th:text="${todo.text}">할 일</textarea>
        </div>
        <!-- 표시와 편집을 겸하는 pill 하나. 클릭 = 다음 단계(높음→보통→낮음)로, 순환은 서버가 한다.
             목업은 "재렌더 없이 제자리 갱신"이었지만 실제 앱은 우선순위가 정렬축이라 목록 순서가 바뀐다. -->
        <button type="button" class="prio" th:classappend="${#strings.toLowerCase(todo.priority.name())}"
                th:title="'우선순위 ' + ${todo.priority.label()} + ' · 클릭해 변경'"
                th:hx-post="@{'/todos/' + ${todo.id} + '/priority'}"
                hx-target="#todoCard" hx-swap="outerHTML"
                th:text="${todo.priority.label()}">보통</button>
        <!-- 기한 변경은 자주 하는 조작이 아니라 행을 늘리지 않는다 — 항목 행의 일정 상세와 같은 접이식(app.js) -->
        <button type="button" class="icon-btn chevron" title="기한 변경"
                th:attr="data-detail-toggle='todoDue' + ${todo.id}">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 6.5h11M5.5 2v2.5M10.5 2v2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="icon-btn" title="할 일 삭제"
                th:hx-post="@{'/todos/' + ${todo.id} + '/delete'}"
                hx-target="#todoCard" hx-swap="outerHTML">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 4.5h10M6.5 4.5V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M4.5 4.5l.6 8.4a1 1 0 0 0 1 .9h3.8a1 1 0 0 0 1-.9l.6-8.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </div>
    <div class="row-detail" th:id="'todoDue' + ${todo.id}">
        <label class="inline">기한
            <input type="date" name="dueDate" th:value="${todo.dueDate}"
                   th:hx-post="@{'/todos/' + ${todo.id} + '/due'}"
                   hx-trigger="change" hx-target="#todoCard" hx-swap="outerHTML"/>
        </label>
    </div>
</div>

<!--
  TODO 카드 = 벤토 우측 타일. 라우트 6개 중 5개(추가/완료/우선순위/기한/삭제)의 응답이 이 프래그먼트다.
  ⚠️ 벤토 배치 클래스(tile t-todo)가 프래그먼트 루트에 붙어 있어야 한다 —
     htmx가 outerHTML로 갈아끼우므로 대시보드 쪽에서 감싸 붙일 수 없다(교체 순간 사라진다).
-->
<div th:fragment="todoCard" class="card tile todo-card t-todo" id="todoCard"
     th:attr="data-overdue-count=${todoOverdueCount}, data-duetoday-count=${todoDueTodayCount}">
    <div class="card-head">
        <div class="card-title">
            <h2>TODO 리스트</h2>
            <span class="count" title="미완료" th:text="${todoOpenCount} + '건'">0건</span>
        </div>
    </div>

    <!--
      추가 입력줄. 텍스트 칸에서 Enter로 바로 저장되려면 submit 버튼이 있어야 한다
      (입력 칸이 둘 이상인 폼은 브라우저가 암묵적 전송을 하지 않는다 — 기록 카드와 같은 이유).
      우선순위만 여기서 예외적으로 클라이언트가 순환시킨다: 아직 만들어지지 않은 할 일이라
      서버에 순환시킬 대상이 없다. 고른 값은 hidden으로 함께 전송된다.
      한국어 라벨을 app.js에 하드코딩하지 않도록 순환 순서(todoPriorities)를 숨은 목록으로 같이 내려준다.
    -->
    <form class="quick-add" th:hx-post="@{/todos}" hx-target="#todoCard" hx-swap="outerHTML">
        <input class="date-sel" type="date" name="dueDate" th:value="${todoDefaultDue}" title="기한"/>
        <input type="hidden" name="priority" th:value="${todoDefaultPriority.name()}" data-todo-newprio-value/>
        <button type="button" class="prio" th:classappend="${#strings.toLowerCase(todoDefaultPriority.name())}"
                data-todo-newprio th:title="'우선순위 ' + ${todoDefaultPriority.label()} + ' · 클릭해 변경'"
                th:text="${todoDefaultPriority.label()}">보통</button>
        <span hidden data-prio-map>
            <i th:each="p : ${todoPriorities}" th:attr="data-value=${p.name()}" th:text="${p.label()}">보통</i>
        </span>
        <input type="text" name="text" data-todo-newtext autocomplete="off" placeholder="할 일 추가 (Enter)"/>
        <button type="submit" class="ghost" title="할 일 추가">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            추가
        </button>
    </form>

    <!-- 고정 높이 타일 안에서 목록만 스크롤한다 — 머리(제목·입력줄)와 발(안내 문구)은 늘 보인다 -->
    <div class="tile-body">
        <!--
          기한이 지난 것들은 날짜가 제각각이라 한 그룹으로 묶고(행마다 날짜 칩), 나머지는 날짜별 그룹.
          ⚠️ 헤더의 건수는 접힘 여부와 무관한 전체 기한지남 건수다(지표 타일 숫자와 어긋나면 안 된다).
        -->
        <div class="day-group" th:if="${todoOverdueCount > 0}">
            <div class="day-head over">
                <span>기한 지남</span>
                <span class="n" th:text="${todoOverdueCount} + '건'">0건</span>
            </div>
            <th:block th:each="todo, st : ${todoOverdue}">
                <div th:replace="~{fragments-todo :: todoRow(${todo}, true, ${st.index >= todoVisibleLimit})}"></div>
            </th:block>
        </div>

        <!-- th:replace는 th:each보다 먼저 처리되므로 반드시 바깥 th:block에 반복을 건다 -->
        <th:block th:each="g : ${todoDayGroups}">
            <div class="day-group" th:classappend="${g.startIndex() >= todoVisibleLimit} ? 'over-limit'">
                <div class="day-head">
                    <span th:text="${g.label()}">08.17 (월)</span>
                    <span class="today-chip" th:if="${g.isToday()}">오늘</span>
                </div>
                <th:block th:each="todo, st : ${g.todos()}">
                    <div th:replace="~{fragments-todo :: todoRow(${todo}, false, ${g.startIndex() + st.index >= todoVisibleLimit})}"></div>
                </th:block>
            </div>
        </th:block>

        <p class="empty-hint" th:if="${todoOpenCount == 0}" style="padding:14px 0;">등록된 할 일이 없습니다.</p>

        <!-- 전체 열람 화면이 없으므로 "더 보기"는 다른 데로 보내지 않고 이 카드 안에서만 펼친다(app.js).
             th:text를 버튼에 걸면 화살표 svg가 지워지므로 라벨은 안쪽 span이 받는다. -->
        <div class="todo-foot" th:if="${todoHiddenCount > 0}">
            <button type="button" class="link-more" data-todo-more
                    th:attr="data-more-label='+' + ${todoHiddenCount} + '건 더 보기'" data-less-label="접기">
                <span th:text="'+' + ${todoHiddenCount} + '건 더 보기'">+2건 더 보기</span>
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>

        <!-- 완료한 것은 지우지 않는다(잘못 체크한 걸 되돌릴 수 있어야 하므로) —
             대신 접어서 남은 일이 목록의 주인공이 되게 한다. -->
        <div class="todo-done" th:if="${todoDoneCount > 0}">
            <button type="button" class="link-more" data-todo-donetoggle
                    th:attr="data-show-label='완료 ' + ${todoDoneCount} + '건 보기'" data-hide-label="완료 숨기기">
                <span th:text="'완료 ' + ${todoDoneCount} + '건 보기'">완료 2건 보기</span>
            </button>
            <div class="todo-done-list">
                <th:block th:each="todo : ${todoDone}">
                    <div th:replace="~{fragments-todo :: todoRow(${todo}, false, false)}"></div>
                </th:block>
            </div>
        </div>
    </div>

    <p class="todo-note">개인용 목록입니다. 주간보고(.md)에는 나가지 않습니다.</p>
</div>

</body>
</html>
