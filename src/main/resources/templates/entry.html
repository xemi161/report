<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>등록 · 주간업무보고</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments :: nav(${activeMenu})}"></div>
<main class="container">
    <h1 th:text="${report.weekLabel} + ' 보고서 등록'">등록</h1>
    <p class="field-errors" th:if="${error}" th:text="${error}">에러</p>

    <!-- 프로젝트 -->
    <h2 class="section-title">프로젝트</h2>
    <div class="card" th:each="entry : ${projectItemsMap}">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 class="subsection-title" style="margin-top:0;" th:text="${entry.key.name}">프로젝트명</h3>
            <form th:action="@{'/entry/projects/' + ${entry.key.id} + '/rename'}" method="post" style="display:flex; gap:4px;">
                <input type="text" name="name" th:value="${entry.key.name}" style="font-size:0.8rem; width:140px;"/>
                <button type="submit" class="icon-btn" title="이름 수정">✏️</button>
            </form>
        </div>
        <th:block th:each="item : ${entry.value}">
            <div th:replace="~{fragments-entry :: itemRow(${item}, false)}"></div>
        </th:block>
        <p class="empty-hint" th:if="${#lists.isEmpty(entry.value)}">아직 항목이 없습니다. 아래에서 추가하세요.</p>
        <div th:replace="~{fragments-entry :: addItemForm('PROJECT', ${entry.key.id})}"></div>
    </div>

    <div class="card">
        <form th:action="@{/entry/projects}" method="post" style="display:flex; gap:8px;">
            <input type="text" name="name" placeholder="새 프로젝트명" class="title"/>
            <button type="submit" class="btn secondary small">+ 새 프로젝트 추가</button>
        </form>
    </div>

    <!-- 개발 -->
    <h2 class="section-title">개발</h2>
    <div class="card">
        <th:block th:each="item : ${devItems}">
            <div th:replace="~{fragments-entry :: itemRow(${item}, true)}"></div>
        </th:block>
        <p class="empty-hint" th:if="${#lists.isEmpty(devItems)}">소요시간이 작은 개별 업무를 등록하세요.</p>
        <div th:replace="~{fragments-entry :: addItemForm('DEV', null)}"></div>
    </div>

    <!-- 기타 -->
    <h2 class="section-title">기타</h2>
    <div class="card">
        <th:block th:each="item : ${etcItems}">
            <div th:replace="~{fragments-entry :: etcVacationRow(${item}, 'ETC')}"></div>
        </th:block>
        <div th:replace="~{fragments-entry :: addEtcVacationForm('ETC')}"></div>
    </div>

    <!-- 휴가 -->
    <h2 class="section-title">휴가</h2>
    <div class="card">
        <th:block th:each="item : ${vacationItems}">
            <div th:replace="~{fragments-entry :: etcVacationRow(${item}, 'VACATION')}"></div>
        </th:block>
        <div th:replace="~{fragments-entry :: addEtcVacationForm('VACATION')}"></div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:24px;">
        <a class="btn secondary" th:href="@{/entry/preview}">미리보기</a>
    </div>
</main>
</body>
</html>
