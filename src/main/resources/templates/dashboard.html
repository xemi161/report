<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('대시보드')}"></head>
<body>
<header th:replace="~{fragments :: header('dashboard', null, null, null)}"></header>

<!--
  첫 진입 화면 — 승인된 벤토(모자이크) 목업 그대로다.

     ┌──────────────────┬────┬────┐
     │ 이번 주 (6×4)     │지표│지표│   (행 1-2)
     │                  ├────┼────┤
     │                  │지표│지표│   (행 3-4)
     ├───────────────┬──┴───┴────┤
     │ 오늘 한 일 (8×6) │ TODO(4×6) │   (행 5-10)
     └──────────────┴────────────┘
     그 아래 전폭으로 과거 보고서.

  ⚠️ **타일을 넣는 순서가 곧 배치다**(.bento는 grid-auto-flow가 dense가 아니라 뒤 타일이 앞으로 끌려오지 않는다).
     순서를 바꾸거나 span 값을 한쪽만 고치면 마지막 띠에 아무도 채우지 않는 빈 구멍이 남는다.
     위 띠 = 이번 주가 어떤 주인가(상태·숫자), 아래 띠 = 지금 뭘 적고 뭘 해야 하나.

  거의 전부 서버가 한 번에 계산해 렌더링하는 정적 화면이고, 동적 영역은 아래 띠의 두 카드뿐이다 —
  "오늘 한 일"(fragments-daily :: dashboardCard)과 "TODO 리스트"(fragments-todo :: todoCard).
  둘 다 조작하면 자기 카드만 통째로 교체된다.
-->
<main>
    <section class="view active">
        <div class="dash-wrap">
            <div class="bento">

                <!-- ① 이번 주(6×4) — 벤토에서 가장 큰 면적이자 화면의 유일한 강한 CTA 자리(accent .btn은 하나만).
                     숫자(시간/맨위크)는 옆 지표 타일이 받는다. 큰 타일이 숫자까지 들고 있으면 작은 타일이 할 일이 없어진다. -->
                <div class="card tile hero t-hero">
                    <div class="hero-top">
                        <div class="hero-left">
                            <span class="kicker">이번 주</span>
                            <div class="hero-title">
                                <span class="wk" th:text="${period.label()}">8월 2주</span>
                                <span class="badge idle" th:if="${report == null}">미작성</span>
                                <span class="badge draft" th:if="${report != null and report.status.name() == 'DRAFT'}">작성중</span>
                                <span class="badge done" th:if="${report != null and report.status.name() == 'SUBMITTED'}">제출됨</span>
                            </div>
                            <span class="rng"
                                  th:text="${#temporals.format(period.weekStart(), 'MM.dd')} + '(금) ~ ' + ${#temporals.format(period.weekEnd(), 'MM.dd')} + '(목)'">08.07(금) ~ 08.13(목)</span>

                            <p class="hero-note" th:if="${report == null}">
                                아직 작성을 시작하지 않았습니다. 지난주 미완료 항목은 자동으로 이월되어 채워집니다.
                            </p>
                            <span class="hero-sub" th:if="${report != null}"
                                  th:text="'이번 주 기록 ' + ${heroLoggedDays} + '일' + (${#strings.isEmpty(heroWeekHoursDisplay)} ? '' : ' · ' + ${heroWeekHoursDisplay} + 'h')">이번 주 기록 3일</span>
                        </div>
                        <!-- 초안 생성은 작성 화면의 "작성 시작"(POST /entry/start)이 담당한다 — 여기선 그 화면으로 보낸다 -->
                        <a th:class="${report != null and report.status.name() == 'SUBMITTED'} ? 'btn outline' : 'btn'"
                           th:href="@{/entry(week=${week})}"
                           th:text="${report == null} ? '신규 작성' : (${report.status.name() == 'SUBMITTED'} ? '수정하기' : '이어서 작성')">신규 작성</a>
                    </div>

                    <!-- 요일 스트립: 이 앱의 한 주는 금~목이라 7칸 전부를 그린다 —
                         주말이 비어 보이는 게 아니라 주말이 이 주 안에 있다는 사실이 보여야 한다.
                         ⚠️ 기록을 추가/삭제하면 htmx가 "오늘 한 일" 카드만 갈아끼우므로 이 스트립은 그 자리에서
                            갱신되지 않는다(다음 페이지 로드에서 맞는다 — 하단 "이번 주 기록 N건"과 같은 절충). -->
                    <div class="wk-days">
                        <th:block th:each="d : ${heroDays}">
                            <div class="wk-day"
                                 th:classappend="(${d.isEmpty()} ? 'empty ' : '') + (${d.today()} ? 'today' : '')"
                                 th:title="${#temporals.format(d.date(), 'MM.dd (E)')} + (${d.isEmpty()} ? ' · 기록 없음' : ' · ' + ${d.hoursDisplay()} + 'h 기록')">
                                <span class="dw" th:text="${d.dow()}">금</span>
                                <span class="bar-v"><i th:if="${d.barPercent() > 0}" th:style="'height:' + ${d.barPercent()} + '%'"></i></span>
                                <span class="hh" th:text="${d.isEmpty()} ? '·' : ${d.hoursDisplay()}">·</span>
                            </div>
                        </th:block>
                    </div>
                </div>

                <!-- ② 지표 타일 4개(3×2씩 2×2 배치) — hero 옆 6칸을 채운다.
                     고른 기준: "지금 손을 대야 하나"를 한 숫자로 답할 수 있는 것만.
                     시간/맨위크는 report.totalHours가 아니라 hero* 속성이다(그 필드는 제출 시점에만 채워진다). -->
                <div class="card tile metric t-metric">
                    <span class="kicker">이번 주 시간</span>
                    <div class="v tabular" th:if="${report != null}">
                        <span th:text="${heroTotalHours}">0</span><u>h</u>
                    </div>
                    <div class="v tabular" th:if="${report == null}">—</div>
                    <span class="s" th:text="${report == null} ? '아직 작성 전' : ('보고 항목 ' + ${heroItemCount} + '건')">아직 작성 전</span>
                </div>

                <div class="card tile metric t-metric"
                     th:classappend="${report != null and heroManWeek.compareTo(lowThreshold) < 0} ? 'low'">
                    <span class="kicker">이번 주 맨위크</span>
                    <div class="v tabular" th:text="${report == null} ? '—' : ${heroManWeek}">—</div>
                    <span class="s"
                          th:text="${report == null} ? '아직 작성 전' : (${heroManWeek.compareTo(lowThreshold) < 0} ? ('기준 1.00 · ' + ${lowThreshold} + ' 미만') : '기준 1.00')">아직 작성 전</span>
                </div>

                <!-- ⚠️ 이 타일만 TODO 카드와 같은 데이터를 읽는다. 할 일을 조작하면 htmx가 #todoCard만 갈아끼우므로
                     여기 숫자는 서버가 갱신해주지 못한다 — 그래서 카드가 들고 오는 data-overdue-count /
                     data-duetoday-count를 app.js가 스왑 직후 이 타일로 옮겨 적는다(완료 배지와 같은 자리). -->
                <div class="card tile metric t-metric" data-metric-overdue
                     th:classappend="${todoOverdueCount > 0} ? 'low'">
                    <span class="kicker">기한 지난 할 일</span>
                    <div class="v tabular"><span class="num" th:text="${todoOverdueCount}">0</span><u>건</u></div>
                    <span class="s"
                          th:text="${todoDueTodayCount > 0} ? ('오늘 마감 ' + ${todoDueTodayCount} + '건') : '오늘 마감 없음'">오늘 마감 없음</span>
                </div>

                <!-- 진행중 판정은 EntryService.activeProjectsWithProgress()가 소유한다(작성 탭과 공유 — 건수가 항상 같아야 한다) -->
                <div class="card tile metric t-metric">
                    <span class="kicker">진행중 프로젝트</span>
                    <div class="v tabular"><span th:text="${activeProjectCount}">0</span><u>개</u></div>
                    <span class="s"
                          th:text="${activeProjectCount > 0} ? ('평균 진행률 ' + ${activeProjectAvgProgress} + '%') : '진행중 없음'">진행중 없음</span>
                </div>

                <!-- ③ 아래 띠 = 매일 손대는 두 목록. 회고(한 일) ↔ 전망(할 일)으로 축이 반대다.
                     두 프래그먼트 모두 벤토 배치 클래스를 자기 루트에 달고 있다(htmx가 outerHTML로 갈아끼우므로). -->
                <div th:replace="~{fragments-daily :: dashboardCard}"></div>
                <div th:replace="~{fragments-todo :: todoCard}"></div>
            </div>

            <!-- ④ 과거 보고서 = 모자이크를 받치는 가로로 긴 타일(전폭). 카드를 누르면 그 주의 작성(수정) 화면으로 간다.
                 목록 길이가 보고서 개수에 따라 변하므로 이 줄만 62px 격자에 못 박지 않는다(.bento-foot). -->
            <div class="bento bento-foot">
                <div class="card tile t-hist">
                    <div class="card-head">
                        <div class="card-title">
                            <h2>과거 보고서</h2>
                            <span class="count" th:text="${pastReportCount} + '개'">0개</span>
                        </div>
                        <a class="link-more" th:if="${pastReportCount > #lists.size(recentReports)}" th:href="@{/history}">
                            전체 보기
                            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </a>
                    </div>
                    <div class="dash-list flush">
                        <th:block th:each="r : ${recentReports}">
                            <a th:replace="~{fragments :: reportCard(${r}, ${lowThreshold})}"></a>
                        </th:block>
                        <p class="empty-hint" th:if="${#lists.isEmpty(recentReports)}">아직 제출된 보고서가 없습니다.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<div class="toast" id="toast"></div>
</body>
</html>
