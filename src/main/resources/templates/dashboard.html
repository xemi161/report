<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('대시보드')}"></head>
<body>
<header th:replace="~{fragments :: header('dashboard', null, null, null)}"></header>

<!--
  첫 진입 화면. 읽는 순서를 그대로 배치했다:
  ① 지금 뭘 해야 하나(이번 주 카드) → ② 매일 들르는 기록 / 주 단위 추세(좌우) → ③ 과거로 돌아가기(최근 5개).

  거의 전부 서버가 계산해 한 번에 렌더링하는 정적 화면이고, 유일한 동적 영역이
  "오늘 한 일" 카드다(fragments-daily :: dashboardCard — 추가/삭제 시 그 카드만 통째로 교체).
-->
<main>
    <section class="view active">

        <!-- ① 이번 주 카드 — 대시보드에서 유일하게 accent .btn을 쓰는 자리(강한 CTA는 화면에 하나만) -->
        <div class="card hero">
            <div class="hero-left">
                <span class="kicker">이번 주</span>
                <div class="hero-title">
                    <span class="wk" th:text="${period.label()}">8월 2주</span>
                    <span class="rng"
                          th:text="${#temporals.format(period.weekStart(), 'MM.dd')} + '(금) ~ ' + ${#temporals.format(period.weekEnd(), 'MM.dd')} + '(목)'">08.07(금) ~ 08.13(목)</span>
                    <span class="badge idle" th:if="${report == null}">미작성</span>
                    <span class="badge draft" th:if="${report != null and report.status.name() == 'DRAFT'}">작성중</span>
                    <span class="badge done" th:if="${report != null and report.status.name() == 'SUBMITTED'}">제출됨</span>
                </div>

                <p class="hero-note" th:if="${report == null}">
                    아직 작성을 시작하지 않았습니다. 지난주 미완료 항목은 자동으로 이월되어 채워집니다.
                </p>
                <!-- 합계는 report.totalHours/totalManWeek이 아니라 hero* 속성을 쓴다 —
                     그 필드들은 제출 시점에만 채워져 작성중(draft) 주에서는 0이다. -->
                <div class="hero-metrics" th:if="${report != null}">
                    <span class="m"><b class="tabular" th:text="${heroTotalHours}">0</b>시간</span>
                    <span class="m"><b class="tabular"
                          th:classappend="${heroManWeek.compareTo(lowThreshold) < 0} ? ' low'"
                          th:text="${heroManWeek}">0.00</b>맨위크</span>
                    <span class="m"><b class="tabular" th:text="${heroItemCount}">0</b>건</span>
                </div>
            </div>
            <!-- 초안 생성은 작성 화면의 "작성 시작"(POST /entry/start)이 담당한다 — 여기선 그 화면으로 보낸다 -->
            <a th:class="${report != null and report.status.name() == 'SUBMITTED'} ? 'btn outline' : 'btn'"
               th:href="@{/entry(week=${week})}"
               th:text="${report == null} ? '신규 작성' : (${report.status.name() == 'SUBMITTED'} ? '수정하기' : '이어서 작성')">신규 작성</a>
        </div>

        <!-- ② 좌(넓음) = 매일 들르는 기록 / 우(좁음) = 주 단위로만 보는 추세 카드들.
             align-items:stretch로 좌측 카드가 우측 스택 끝까지 늘어난다(한쪽이 작아 보이지 않게). -->
        <div class="dash-grid">
            <div th:replace="~{fragments-daily :: dashboardCard}"></div>

            <div class="dash-side">
                <div class="card">
                    <span class="kicker" th:text="'최근 ' + ${avgWeekCount} + '주 평균 맨위크'">최근 2주 평균 맨위크</span>
                    <div class="mw-big tabular"
                         th:classappend="${avgManWeek.compareTo(lowThreshold) < 0} ? ' low'"
                         th:text="${avgManWeek}">0.00</div>
                    <div class="mw-sub" th:text="'기준 1.00 · ' + ${lowThreshold} + ' 미만이면 낮음으로 표시'">기준 1.00</div>
                    <div class="mw-weeks">
                        <div class="mw-week" th:each="w : ${avgWeeks}">
                            <div class="top">
                                <span class="lb" th:text="${w.weekLabel}">8월 1주</span>
                                <span class="vl tabular"
                                      th:classappend="${w.totalManWeek.compareTo(lowThreshold) < 0} ? ' low'"
                                      th:text="${w.totalManWeek}">0.00</span>
                            </div>
                            <div class="bar" th:classappend="${w.totalManWeek.compareTo(lowThreshold) < 0} ? ' low'"
                                 th:with="pct=${w.totalManWeek > 1 ? 100 : w.totalManWeek * 100}">
                                <i th:style="'width:' + ${pct} + '%'"></i>
                            </div>
                        </div>
                        <p class="empty-hint" th:if="${#lists.isEmpty(avgWeeks)}">평균을 낼 보고서가 아직 없습니다.</p>
                    </div>
                </div>

                <!-- 진행중 판정: Project.active == true AND 가장 최근 보고된 진행률 < 100% (backend 확정) -->
                <div class="card">
                    <div class="card-head">
                        <div class="card-title">
                            <h2>진행중인 프로젝트</h2>
                            <span class="count" th:text="${activeProjectCount} + '건'">0건</span>
                        </div>
                    </div>
                    <div>
                        <div class="proj-row" th:each="p : ${activeProjects}">
                            <div class="proj-top">
                                <span class="nm" th:text="${p.project.name}">GTPP</span>
                                <span class="tk" th:if="${!#strings.isEmpty(p.project.ticket)}"
                                      th:text="${p.project.ticket}">NHNKCP-개발1팀/23</span>
                                <span class="pc tabular" th:text="${p.completion} + '%'">0%</span>
                            </div>
                            <div class="bar"><i th:style="'width:' + ${p.completion} + '%'"></i></div>
                            <div class="proj-meta" th:if="${p.lastWeekLabel != null}"
                                 th:text="'최근 보고 · ' + ${p.lastWeekLabel}">최근 보고 · 8월 1주</div>
                            <div class="proj-meta" th:if="${p.lastWeekLabel == null}">아직 보고된 적 없음</div>
                        </div>
                        <p class="empty-hint" th:if="${activeProjectCount == 0}">진행중인 프로젝트가 없습니다.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- ③ 과거 보고서 최근 5개 — 카드를 누르면 그 주의 작성(수정) 화면으로 간다 -->
        <div class="section-head">
            <h2>과거 보고서</h2>
            <a class="link-more" th:if="${pastReportCount > 5}" th:href="@{/history}"
               th:text="'전체 ' + ${pastReportCount} + '개 보기'">전체 보기</a>
        </div>
        <div class="dash-list">
            <th:block th:each="r : ${recentReports}">
                <a th:replace="~{fragments :: reportCard(${r}, ${lowThreshold})}"></a>
            </th:block>
            <p class="empty-hint" th:if="${#lists.isEmpty(recentReports)}">아직 제출된 보고서가 없습니다.</p>
        </div>
    </section>
</main>

<div class="toast" id="toast"></div>
</body>
</html>
