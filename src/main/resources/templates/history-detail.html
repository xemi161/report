<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>이력 상세 · 주간업무보고</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments :: nav(${activeMenu})}"></div>
<main class="container">
    <p><a th:href="@{/history}">← 이력 목록</a></p>
    <h1 th:text="${report.weekLabel}">주차</h1>
    <p style="color: var(--muted);" th:text="${report.weekStart} + ' ~ ' + ${report.weekEnd} + ' (제출: ' + ${report.submittedAt} + ')'">기간</p>

    <div class="md-preview" th:text="${mdText}">md 내용</div>

    <div style="display:flex; justify-content:flex-end; margin-top:20px;">
        <a class="btn" th:href="@{'/export/' + ${report.id}}">md 다운로드</a>
    </div>
</main>
</body>
</html>
